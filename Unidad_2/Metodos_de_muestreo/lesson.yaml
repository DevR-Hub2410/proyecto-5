  CorrectAnswer: Un sondeo exploratorio rápido y de bajo presupuesto para probar una idea antes de un estudio más riguroso
  AnswerTests: omnitest(correctVal='Un sondeo exploratorio rápido y de bajo presupuesto para probar una idea antes de un estudio más riguroso')
  Hint: ¿Qué diferencias existen en los niveles de presupuesto de cada opción mostrada?
  
- Class: text
  Output: Cuando se utiliza el muestreo de conveniencia, es necesario describir cómo la muestra de las pruebas en la investigación actual sería diferente de la muestra ideal, seleccionada al azar. También es necesario describir los individuos que podrían quedar fuera durante el proceso de selección o los individuos que están sobrerrepresentados.

