- Class: text
  Output: Es importante reconocer la diferencia entre estrato y conglomerado. Un estrato es un bloque homogéneo de la población, del cual se extrae una muestra, mientras que un conglomerado, como lo mencionamos al principio, es un grupo definido de forma natural que representa una pequeña parte de toda la población. Solo si la población de elementos dentro de un conglomerado es muy grande, se toma una muestra de él (dos etapas), si no, se estudia a todos. En cambio, en el muestreo estratificado, se toma una muestra de cada uno de los estratos, sin importar el número de elementos que tenga cada uno. #(Velázquez, 2017, p. 5-6.) y (Gallego, 2011, [5]).
  
