- Class: mult_question
  Output: Quieres asegurarte de que tu muestra incluya usuarios de Móvil, Laptop y Tablet, en proporciones parecidas a como están distribuidos en tu población completa. ¿Qué método usarías?
  AnswerChoices: Estratificado;Aleatorio simple;Sistemático;Por conglomerados;Por conveniencia
  CorrectAnswer: Estratificado
  AnswerTests: omnitest(correctVal='Estratificado')
  Hint: Piensa en el método que divide la población en grupos y después muestrea dentro de cada uno.
  
- Class: mult_question
  Output: Tu empresa tiene oficinas en 20 ciudades distintas. Por falta de presupuesto, decides elegir al azar solo 3 ciudades completas, y encuestar a TODOS los empleados de esas 3 ciudades, sin visitar las otras 17. ¿Qué método estás usando?
  AnswerChoices: Por conglomerados;Aleatorio simple;Sistemático;Estratificado;Por conveniencia
  CorrectAnswer: Por conglomerados
  AnswerTests: omnitest(correctVal='Por conglomerados')
  Hint: Piensa en el método donde seleccionas grupos completos, no una parte de cada grupo.
  
- Class: mult_question
  Output: Quieres una opinión rápida sobre un cambio en la app, así que le preguntas a los primeros 20 usuarios que la abran hoy, sin ningún criterio especial de selección. ¿Qué método estás usando?
  AnswerChoices: Por conveniencia;Aleatorio simple;Sistemático;Estratificado;Por conglomerados
  CorrectAnswer: Por conveniencia
  AnswerTests: omnitest(correctVal='Por conveniencia')
  Hint: Piensa en el método más fácil y rápido de aplicar, aunque no garantice representatividad.
  
- Class: text
  Output: Con esto terminamos la comparación de métodos de muestreo. Elegir el método correcto depende de qué tan importante es la representatividad, cuánto presupuesto y tiempo tienes, y si tu población tiene grupos naturales que te convenga aprovechar.
  
- Class: text
  Output: Este curso presentó los cinco tipos de muestreo para elegir el más adecuado según la población y el objetivo del estudio, el aleatorio simple (misma probabilidad para todos, requiere un listado completo), el sistemático (cada k-ésimo elemento, con riesgo ante patrones ocultos), el estratificado (muestra de cada subgrupo para garantizar representación), el de conglomerados (grupos naturales completos, útil en poblaciones dispersas) y el de conveniencia (los más accesibles, rápido pero sesgado). También practicaste su aplicación en R con sample(), seq() y split(). Dicho esto, llegamos al final, !Felicidades¡ Lograste completar satisfactoriamente todo el curso sobre los diferentes tipos de muestreo. Nos vemos en las siguiente lección...
  
