  CorrectAnswer: Es un muestreo de conveniencia y puede no representar a toda la población estudiantil
  AnswerTests: omnitest(correctVal='Es un muestreo de conveniencia y puede no representar a toda la población estudiantil')
  Hint: El profesor usó un grupo accesible (su propia clase) en lugar de seleccionar aleatoriamente entre toda la población de estudiantes, ¿qué efecto puede producir en los resultados?
  
