- Class: text
  Output: Es solo uno de los varios tipos de muestreo que existen, trata de sacar individuos al azar de una lista, mejor conocido como el marco de la encuesta y todos los datos de la población tienen la misma probabilidad de ser seleccionados para ser parte de la muestra. #(Ana L, Carrilo, 2015, [16]) y (Casal & Mateu, 2003, p. 5).
  
- Class: text
  Output: Un ejemplo sencillo de este tipo de muestreo, sería en un salón de clases, donde ocupan a 3 personas que participen en un concurso de cuentos, entonces deciden hacer una ruleta que contenga los nombres de los 30 alumnos del salón, al girar la ruleta tres veces nombran a 3 personas, las cuales deberán participar en dicho concurso. Este es un ejemplo claro, ya que la población serían los 30 alumnos, todos tienen la misma probabilidad de ser seleccionados y fueron seleccionados de forma aleatoria. 
  
