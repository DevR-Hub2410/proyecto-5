- Class: cmd_question
  Output: Primero, calcula el intervalo de muestreo k, dividiendo N entre n. Guarda el resultado en un objeto llamado 'k'. Escribe tu código en el script que se abrirá y luego guarda el archivo.
  CorrectAnswer: k <- N / n
