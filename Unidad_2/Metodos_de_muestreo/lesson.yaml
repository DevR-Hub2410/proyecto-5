- Class: text
  Output: Muestreo estratificado...
  
- Class: text
  Output: Al terminar esta sección vas a poder identificar cuándo conviene usar muestreo estratificado, dividir una población en estratos, y seleccionar una muestra de cada uno usando R.
  
- Class: text
  Output: La estratificación es una de las técnicas más difundidas y usadas en muestreo. Permite tratar con subpoblaciones, aumenta la eficiencia de las estimaciones y contribuye a la administración eficiente de grandes encuestas. #(Gutiérrez, H. A. (2016))

- Class: text
  Output: Cuando existe en el marco de muestreo información auxiliar que permite la división de la población en subgrupos con el objetivo de seleccionar una muestra en cada subgrupo, la estrategia de muestreo utiliza un diseño de muestreo estratificado y el nombre de los subgrupos, formados antes de la recolección de la información, se denomina estratos. #(Gutiérrez, H. A. (2016))

- Class: text
  Output: Se divide la población en grupos en función de un carácter determinado y después se muestra cada grupo aleatoriamente, para obtener la parte proporcional de la muestra. Este método se aplica para evitar que por azar algún grupo esté menos representado que los otros. #(Casal, J., y Mateu, E. (2003))

- Class: text
