  Output: De este mismo ejercicio, aplica la fórmula del intervalo para obtener su tamaño mediante el operador de división. 
  CorrectAnswer: 4000/200
  AnswerTests: omnitest(correctExpr='4000/200')
  Hint: Recuerda que la población es N, y la muestra n.

- Class: text
