#=================================================================================================================
#                                             MUESTREO SISTEMÁTICO
#=================================================================================================================

- Class: text
  Output: Muestreo sistemático...

- Class: text
  Output: En esta parte del curso haremos uso de operadores para la aplicación de fórmulas y de funciones de muestreo. Al final de esta sección comprenderás cuándo y cómo aplicar el muestreo sistemático.
  
- Class: text
  Output: El muestreo sistemático consiste en seleccionar cada k-ésimo elemento de una lista poblacional tras elegir aleatoriamente el primero. La letra k es la razón de muestreo, esto es, la razón del tamaño de la población correspondiente al tamaño de la muestra. #(Velázquez, 2017)

- Class: text
  Output: Los pasos para aplicarlo son; 1. Definir la población. 2. Determinar el tamaño de la muestra. 3. Calcular el intervalo de muestreo. Hacer uso de la fórmula, k = N/n.
  
- Class: mult_question
  Output: Antes de continuar con los pasos. En la fórmula para calcular el intervalo del muestreo k = N/n, ¿qué representan la N mayúscula y la n minúscula en la operación?
  AnswerChoices: Tamaño de la población (N), y tamaño de muestra (n);Tamaño de la población (n), y tamaño de muestra (N);Tamaño del intervalo (N), y tamaño de muestra (n)
  CorrectAnswer: Tamaño de la población (N), y tamaño de muestra (n)
  AnswerTests: omnitest(correctVal='Tamaño de la población (N), y tamaño de muestra (n)')
  Hint: Relaciona, ¿que es más grande, población o muestra?, ¿cómo lo representamos de forma visual?
  
- Class: text
  Output: Después de calcular el intervalo de muestreo (k), al dividir el tamaño de la población (N) por el tamaño de la muestra(n), donde k = N/n, debemos continuar con los siguientes pasos; 4. Elegir un punto de partida. Seleccione aleatoriamente un punto de partida entre 1 y k para iniciar el proceso de muestreo sistemático. 5. Seleccionar elementos de muestra. Proceda a seleccionar cada k-ésimo elemento de la lista de población, comenzando desde el punto de partida elegido aleatoriamente. #(Benítez, 1998)
  
- Class: text
  Output: Retomando el paso 4, seleccionar el punto de partida establece el punto de referencia inicial para seleccionar los elementos de la muestra. La elección del punto de partida puede influir en la representatividad y la aleatoriedad de la muestra, afectando así la validez y la fiabilidad de los resultados del estudio.
  
- Class: text
  Output: Por ejemplo, un supermercado quiere evaluar la satisfacción de sus clientes y decide encuestar a 100 personas de las aproximadamente 2,000 que visitan la tienda en un día. Apliquemos el método.

- Class: text
  Output: Primero definimos el tamaño de la población (N) = 2000 clientes esperados ese día. Luego, el tamaño de la muestra (n) = 100 clientes. Calculamos el intervalo de muestreo (k) = 2000/100 = 20. Escogemos un punto de inicio aleatorio; entre el cliente 1 y el 20, que es nuestro intervalo. Supongamos que sale el número 7.
  
- Class: text
  Output: Seleccionamos la muestra; a partir de ahí, se encuesta cada 20° cliente que entra a la tienda; Cliente 7, 27, 47, 67, 87, 107, 127... y así sucesivamente hasta completar 100 encuestas. Entonces, el encargado se coloca en la entrada y deja pasar a los primeros 6 clientes, encuesta al 7º, deja pasar 19 más, encuesta al siguiente, y repite este patrón durante el resto del día.

- Class: text
  Output: Como puedes observar, es un método muy fácil de aplicar, sin embargo, tiene sus propios riesgos. En el ejemplo anterior, si existiera un patrón oculto, por ejemplo, que cada 20 clientes tienda a repetirse el mismo tipo de comprador (como familias que llegan juntas en grupos de ese tamaño), la muestra podría estar sesgada. Por eso conviene verificar que no haya periodicidad en el flujo de clientes que coincida con el intervalo k.
  
- Class: mult_question
  Output: ¿En cuál de los siguientes casos NO conviene usar muestreo sistemático?
  AnswerChoices: Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina;Una biblioteca selecciona cada 15º libro de un estante ordenado alfabéticamente por autor para revisar su estado de conservación;Una universidad selecciona a cada 8º estudiante de una lista ordenada aleatoriamente por número de identificación asignado al azar;Un ayuntamiento encuesta a cada 20ª vivienda de una calle, numeradas de forma consecutiva sin ningún patrón especial
  CorrectAnswer: Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina
  AnswerTests: omnitest(correctVal='Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina')
  Hint: ¿El intervalo de muestreo (cada 10º, cada 15º, cada 20º, cada 8º) coincide con algún ciclo, patrón o repetición que ya exista de forma natural en esa población?
  
- Class: text
  Output: El muestreo sistemático falla cuando existe una periodicidad oculta en la población que coincide (o es múltiplo) del intervalo k. En este caso, si la máquina falla cada 10 unidades y se revisa cada 10ª pieza, la muestra podría caer siempre en piezas defectuosas (o siempre en piezas buenas), dando una imagen totalmente distorsionada de la calidad real de producción.
  
- Class: text
  Output: Este muestreo puede aplicarse en casos donde la variable varía de forma gradual a lo largo del espacio. De esta manera, se fija la medición de las variables de interés a intervalos regulares a lo largo de la transecta. Recuerda, es necesario identificar si existe algún patrón regular en las unidades para evitar sesgos, por eso es una buena práctica revisar si existe algún patrón cíclico en la población antes de aplicar este método. #(Pereyra y Vaira, 2021)
  
- Class: text
  Output: Veamos unos ejercicios de práctica.

- Class: exact_question
