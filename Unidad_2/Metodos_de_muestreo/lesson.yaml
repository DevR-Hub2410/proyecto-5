- Class: text
  Output: Con el punto de inicio definido, ya puedes generar todas las posiciones que conformarán tu muestra sistemática; inicio, inicio + k, inicio + 2k, y así sucesivamente hasta cubrir la población.
 
- Class: cmd_question
  Output: Genera un vector con las posiciones seleccionadas usando seq(). Debe comenzar en 'inicio', avanzar de 'k' en 'k', y no pasarse de N. Guárdalo como 'posiciones'.
  CorrectAnswer: posiciones <- seq(inicio, N, by = k)
  AnswerTests: omnitest(correctExpr='posiciones <- seq(inicio, N, by = k)')
  Hint: seq(inicio, N, by = k) genera la secuencia completa de posiciones.
  
- Class: text
  Output: Ahora usa esas posiciones para extraer las alturas correspondientes del vector 'alturas_arboles'. Esta será tu muestra sistemática.
 
- Class: cmd_question
  Output: Extrae los valores de 'alturas_arboles' en las posiciones indicadas por 'posiciones', usando indexación con corchetes. Guarda el resultado como 'muestra'.
  CorrectAnswer: muestra <- alturas_arboles[posiciones]
  AnswerTests: omnitest(correctExpr='muestra <- alturas_arboles[posiciones]')
  Hint: Usa alturas_arboles[posiciones] para extraer los valores en esas posiciones.
  
- Class: cmd_question
  Output: Despliega la muestra obtenida.
  CorrectAnswer: muestra
  AnswerTests: omnitest(correctExpr='muestra')
