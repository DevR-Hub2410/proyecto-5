#                                             MUESTREO POR CONVENIENCIA
#=================================================================================================================

- Class: text
  Output: Muestreo por conveniencia...
  
- Class: text
  Output: En esta fracción del curso conocerás las ventajas prácticas pertenecientes a este tipo de muestreo, así como sus limitaciones y sesgos generados. Al terminar podrás identificar por tu cuenta en qué situaciones es útil su uso y diferenciarlas de las situaciones menos favorables.
  
- Class: text
  Output: El muestreo por conveniencia es un método que no utiliza selección aleatoria ni ningún criterio predefinido para elegir las unidades de muestra. En su lugar, el investigador selecciona las unidades en función de su conveniencia, como la proximidad, la disponibilidad o la voluntad de participar. Por ejemplo, clientes recurrentes de una tienda, muestras obtenidas en instituciones de salud, un grupo de pacientes, incluso amigos del investigador. #(Ardilla et al., 2004, p. 137)
  
- Class: text
  Output: Además, puede proporcionar información útil o datos preliminares cuando tiene una población grande o un grupo difícil de alcanzar. No requiere el diseño de un marco muestral, la estratificación de la población ni el uso de técnicas de aleatorización. De este modo, se ahorra tiempo y recursos a la hora de localizar y contactar con las unidades de muestra.

- Class: mult_question
  Output: ¿Cuál de las siguientes situaciones describe mejor un muestreo de conveniencia?
  AnswerChoices: Dividir a la población en grupos y seleccionar aleatoriamente dentro de cada grupo; Seleccionar 100 estudiantes al azar de una lista completa de matrícula; Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado; Enumerar a todos los elementos de la población y usar un generador de números aleatorios
  CorrectAnswer: Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado
  AnswerTests: omnitest(correctVal='Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado')
  Hint: ¿Qué opción es más sencilla de realizar?
  
- Class: text
  Output: Este muestreo tiene algunas ventajas sobre otros métodos de muestreo, pues es fácil y rápido de implementar, económico y eficiente. Puede proporcionar información útil o datos preliminares cuando tiene una población grande o un grupo difícil de alcanzar. No requiere el diseño de un marco muestral, la estratificación de la población ni el uso de técnicas de aleatorización. De este modo, se ahorra tiempo y recursos a la hora de localizar y contactar con las unidades de muestra.
  
- Class: text
  Output: En pruebas piloto, la muestra de conveniencia se suele utilizar ya que permite al investigador obtener los datos básicos y las tendencias con respecto a su estudio, sin las complicaciones del uso de una muestra aleatoria. Esta técnica de muestreo es también útil para documentar que una calidad particular de una sustancia o fenómeno se produce dentro de una muestra dada.
  
- Class: text
  Output: Tales pruebas piloto, o de prueba inicial son también muy útiles para la detección de relaciones entre fenómenos diferentes.Una vez realizado el estudio, si se comprueba que los resultados son favorables a sus predicciones, ya se puede plantear la posibilidad de hacer el estudio con muestras probabilísticas para generalizar el resultado. #(Morales, s.f.)

- Class: text
  Output: Sin embargo, no es uno de los preferidos debido a que en estos estudios la clave es extraer la mayor cantidad posible de información de los pocos casos de la muestra, y el método por conveniencia puede no suministrar las fuentes más ricas en información. Es menos creíble, ya que no puede justificar la selección de la muestra ni demostrar la fiabilidad o validez de los datos. #(Blanco y Castro, 2007)

- Class: text
  Output: La crítica principal son los sesgos o prejuicios del muestreo, por no demostrar imparcialidad al ser escogida, la muestra no es representativa de toda la población. Debido a la falta de control sobre las características o la diversidad de las unidades muestrales, puede ocasionar una sobrerrepresentación o infrarrepresentación de determinados grupos o variables.
  
- Class: mult_question
  Output: ¿Cuál es la principal desventaja del muestreo de conveniencia?
  AnswerChoices: Es muy costoso de implementar; Requiere demasiado tiempo de planeación; Puede producir una muestra sesgada que no representa a toda la población; No se puede aplicar a estudios cuantitativos
  CorrectAnswer: Puede producir una muestra sesgada que no representa a toda la población
  AnswerTests: omnitest(correctVal='Puede producir una muestra sesgada que no representa a toda la población')
  Hint: Aquí hay 3 mentiras y una verdad.
  
- Class: text
  Output: El muestreo por conveniencia es propenso a errores de muestreo y problemas de generalización, ya que es difícil estimar la variabilidad del muestreo, los intervalos de confianza o los márgenes de error. El sesgo sistemático es una diferencia constante entre los resultados de la muestra y los resultados teóricos de toda la población. No es raro que los resultados de un estudio, que utiliza una muestra de conveniencia, difieran significativamente con los resultados de toda la población, por lo que se dice que se obtienen resultados sesgados. #(Morales, s.f.)

- Class: mult_question
