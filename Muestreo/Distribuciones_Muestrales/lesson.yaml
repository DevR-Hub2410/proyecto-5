- Class: text
  Output: Antes de entrar a la media y a la proporcion, necesitas entender el concepto general de distribucion muestral, y por que no es lo mismo que la distribucion de tus datos.

- Class: text
  Output: Consideremos todas las posibles muestras de tamaño n en una poblacion. Para cada muestra podemos calcular un estadístico (media, desviacion tipica, proporcion) que variará de una a otra. Así obtenemos una distribución del estadístico que se llama distribucion muestral.

- Class: text
  Output: Es importante diferenciar tres cosas que suenan parecidas pero no son lo mismo. La distribución de los datos es cómo se reparten los valores originales dentro de toda tu población o tu muestra. La distribución de una muestra es simplemente cómo se ven los datos de esa muestra en particular que tomaste. La distribución muestral de un estadístico es la distribución que se forma si calculas ese estadístico en muchas muestras distintas.

- Class: mult_question
  Output: Si calculas la media de una sola muestra de 30 usuarios, ese único numero forma parte de que tipo de distribucion?
  AnswerChoices: La distribucion muestral de la media;La distribucion de la poblacion completa;No pertenece a ninguna distribucion
  CorrectAnswer: La distribucion muestral de la media
  AnswerTests: omnitest(correctVal='La distribucion muestral de la media')
  Hint: Piensa en que esa media es un resultado que cambiaria si tomaras otra muestra distinta.

- Class: mult_question
  Output: Cuál de estas opciones describe mejor la distribucion de los datos, en vez de una distribucion muestral?
  AnswerChoices: Como se reparten los valores individuales dentro de tu poblacion o muestra;La distribucion de muchas medias calculadas sobre distintas muestras;La distribucion de muchas proporciones calculadas sobre distintas muestras;Una distribucion que solo existe de forma teorica
  CorrectAnswer: Como se reparten los valores individuales dentro de tu poblacion o muestra
  AnswerTests: omnitest(correctVal='Como se reparten los valores individuales dentro de tu poblacion o muestra')
  Hint: La distribucion de los datos habla de los valores en si, no de un estadistico calculado repetidas veces.

- Class: text
  Output: Con esto ya tienes las bases para entender las siguientes secciones, donde vas a ver la distribución muestral aplicada específicamente a la media y a la proporción.

- Class: text
  Output: Comencemos con la práctica de Distribución muestral de la media. Como ya sabes tomar muestras, ahora vamos a ver que pasa si tomas muchas muestras distintas de la misma poblacion, y calculas la media de cada una.

- Class: text
  Output: La media muestral es uno de los estadísticos mas importantes y juega un papel fundamental en situaciones en las cuales las medias poblacionales son desconocidas. Es el promedio calculado a partir de una muestra, no de toda la población.

- Class: text
  Output: La distribución muestral de la media depende de varias circunstancias como la distribución de la poblacion de la que se extrae las muestras, y se forma si repites el muestreo muchas veces y calculas la media de cada muestra. No es la distribución de los datos originales, es la distribucion de un estadistico calculado sobre muchas muestras posibles.

- Class: text
  Output: Por ejemplo, imagina que varios equipos de un mismo proyecto de software quieren saber el tiempo promedio de respuesta de una app, pero no pueden medir a todos los usuarios. Cada equipo mide una muestra distinta y calcula su propio promedio. Es normal que un equipo obtenga 2.4 segundos, otro 2.6, y otro 2.5, aunque los tres esten midiendo la misma app. Esas diferencias entre los promedios de cada equipo son justamente la distribucion muestral de la media en accion.

- Class: text
  Output: Ya tienes listo el vector tiempo, con 10 tiempos de respuesta de una app en segundos, ahora practicaras con el.

- Class: cmd_question
  Output: Toma una muestra de 3 valores de tiempo y calcula su media. Escribe mean(sample(tiempo, 3)).
  CorrectAnswer: mean(sample(tiempo, 3))
  AnswerTests: omnitest(correctExpr='mean(sample(tiempo, 3))')
  Hint: Primero sample() saca 3 valores del vector tiempo, despues mean() calcula el promedio de esos 3.

- Class: text
  Output: Actividad de interpretacion. Corre ese mismo comando dos o tres veces mas. Vas a notar que la media te sale distinta cada vez, aunque siempre estas muestreando del mismo vector tiempo. Explica en tus palabras por que pasa esto.

- Class: text
  Output: Para ver la distribucion muestral completa, no basta con una sola media. Necesitas repetir el proceso muchas veces y guardar cada resultado.

- Class: cmd_question
  Output: Repite 500 veces el proceso de tomar una muestra de 3 y calcular su media, guardando todos los resultados en un vector llamado medias_3. Escribe medias_3 <- replicate(500, mean(sample(tiempo, 3))).
  CorrectAnswer: medias_3 <- replicate(500, mean(sample(tiempo, 3)))
  AnswerTests: omnitest(correctExpr='medias_3 <- replicate(500, mean(sample(tiempo, 3)))')
  Hint: replicate() repite la misma instruccion muchas veces y guarda todos los resultados en un vector.

- Class: cmd_question
  Output: Dibuja un histograma de medias_3 usando hist(medias_3).
  CorrectAnswer: hist(medias_3)
  AnswerTests: omnitest(correctExpr='hist(medias_3)')
  Hint: Usa hist() y el vector recien creado.

- Class: text
  Output: El histograma que acabas de ver se conoce como una aproximación al Teorema del Limite Central. El teorema del limite central es un tema fundamental de probabilidad y estadistica, ya que los datos que estos utilizan para sus procedimientos deben ser representativos de la poblacion con la que se esta trabajando, y el teorema les permitira obtenerlos.

- Class: text
  Output: El Teorema del Limite Central tambien explica que pasa con la variabilidad de las medias muestrales conforme aumenta el tamano de muestra. Si tomas muestras cada vez mas grandes de la misma poblacion y calculas el promedio de cada una, esos promedios se van pareciendo cada vez mas entre si, su variabilidad disminuye, y su distribucion se acerca cada vez mas a una forma de campana normal.

- Class: mult_question
  Output: Segun el Teorema del Limite Central, que forma tiende a tomar la distribucion de muchas medias muestrales?
  AnswerChoices: Una forma de campana, parecida a la normal;Una linea recta;Una forma completamente al azar sin patron;Siempre la misma forma que los datos originales
  CorrectAnswer: Una forma de campana, parecida a la normal
  AnswerTests: omnitest(correctVal='Una forma de campana, parecida a la normal')
  Hint: Piensa en el Teorema del Limite Central que acabas de leer.

- Class: text
  Output: Ahora vamos a ver que pasa con la variabilidad de esas medias si cambias el tamaño de cada muestra.

- Class: cmd_question
  Output: Repite el mismo proceso, pero ahora con muestras de 6 valores en vez de 3. Como tiempo solo tiene 10 datos, usa replace = TRUE para poder tomar 6 con reemplazo. Escribe medias_6 <- replicate(500, mean(sample(tiempo, 6, replace = TRUE))).
  CorrectAnswer: medias_6 <- replicate(500, mean(sample(tiempo, 6, replace = TRUE)))
  AnswerTests: omnitest(correctExpr='medias_6 <- replicate(500, mean(sample(tiempo, 6, replace = TRUE)))')
  Hint: Es el mismo comando de antes, pero cambia el 3 por 6, y agrega replace = TRUE.

- Class: cmd_question
  Output: Calcula la desviación estándar de medias_6 usando sd(medias_6).
  CorrectAnswer: sd(medias_6)
  AnswerTests: omnitest(correctExpr='sd(medias_6)')
  Hint: sd() calcula la desviacion estandar, que te dice que tan dispersos estan los valores.

- Class: text
  Output: Actividad de interpretación. Compara sd(medias_3) contra sd(medias_6). Cuál de los dos es mas chico? Explica por qué, al usar muestras mas grandes, las medias muestrales varian menos entre si.

- Class: mult_question
  Output: Si aumentas el tamaño de cada muestra, qué le pasa a la variabilidad de la distribución muestral de la media?
  AnswerChoices: Disminuye, las medias se parecen mas entre si;Aumenta, las medias varian mas;Se queda exactamente igual;Deja de existir la distribucion muestral
  CorrectAnswer: Disminuye, las medias se parecen mas entre si
  AnswerTests: omnitest(correctVal='Disminuye, las medias se parecen mas entre si')
  Hint: Piensa en lo que acabas de comparar entre medias_3 y medias_6.

- Class: text
  Output: Buen trabajo! Con esto terminas la seccion de distribucion muestral de la media. Aprendiste que la media muestral cambia de muestra a muestra, que la distribucion de esas medias tiende a formar una campana segun el Teorema del Limite Central, y que entre mas grande sea cada muestra, menos varian las medias entre si.

- Class: text
  Output: Estas listo para el siguiente tema, sigamos aprendiendo.

- Class: text
  Output: Bienvenido! En esta leccion conoceras que es la distribucion muestral de la proporcion y el como obtenerla mediante RStudio. Al finalizar, vas a poder tomar muestras de una poblacion, calcular la proporcion de cada una, y entender por que esos resultados varian entre si. Comencemos.

- Class: text
  Output: Esta distribucion se genera de igual manera que la distribucion muestral de medias, pero ahora, en vez de calcular las medias de cada muestra extraida de la poblacion, se calcula la proporcion muestral, P-gorro. La variable aleatoria P-gorro, que da la proporcion de individuos que presentan cierta caracteristica en muestras de tamano n, tiene las siguientes propiedades.

- Class: text
  Output: |
     1. Su media es p, es decir es identica a la proporcion poblacional.

     2. Su desviacion tipica es sqrt(p*(1-p)/n).

     3. Si n es lo suficientemente grande, y p no es cercano a cero ni a 1, P-gorro se aproxima a la Normal correspondiente, P-gorro ~ N( p , sqrt( p*(1-p) / n ) )

- Class: text
  Output: Por ejemplo, si en una oficina se sabe que el 30% de los empleados toma cafe diariamente. Se toma una muestra de 50 empleados. p = 0.30 (proporcion poblacional) y n = 50 (tamano de la muestra). Su media de la distribucion es p = 0.30, su desviacion tipica es sqrt(0.30*(0.70)/50) = 0.064. Como n*p = 15 y n*(1-p) = 35 y los dos son mayores a 5, podemos usar la aproximacion normal (P-gorro ~ N (0.30, 0.064)).

- Class: text
  Output: En este ejemplo el 0.064 muestra la dispersion de los valores, mientras que el 0.30 es la media, que es el valor mas probable.

- Class: mult_question
  Output: Si en vez de tomar una muestra de 50 empleados, se toma una muestra de 200 empleados (manteniendo p = 0.30), que le pasa a la desviacion tipica de P-gorro?
  AnswerChoices: Aumenta;Disminuye;Se queda igual;Se vuelve cero
  CorrectAnswer: Disminuye
  AnswerTests: omnitest(correctVal='Disminuye')
  Hint: Mira la formula sqrt(p*(1-p)/n). El numerador (p*(1-p)) no cambia porque p sigue siendo 0.30. Que pasa con la fraccion completa si el denominador (n) crece?

- Class: text
  Output: Muy bien! Ahora que ya sabemos como manejarlo de forma manual, vamos a practicarlo mediante funciones en R con un caso parecido. Vamos a trabajar con una poblacion binaria, en nuestro caso Si y No, con una proporcion real de 0.65. Comencemos.

- Class: text
  Output: Ya tenemos definida a nuestra poblacion con un total de 10000 elementos. Supongamos que se aplico una encuesta y 65% responde que si toman cafe y el resto no lo hace. Realiza lo siguiente.

- Class: cmd_question
  Output: Elige una muestra (n = 30) de personas, usa el muestreo sin reemplazo y obten tambien el porcentaje de las personas que respondieron que si a dicha encuesta.
  CorrectAnswer: mean(sample(poblacion, n, replace = FALSE) == "Si")
  AnswerTests: omnitest(correctExpr='mean(sample(poblacion, n, replace = FALSE) == "Si")')
  Hint: Recuerda usar la funcion sample() y la funcion mean(). Tambien recuerda usar el replace de forma correcta.

- Class: text
  Output: Excelente! Ahora puedes observar que no te dio un valor exacto a 65%; si vuelves a realizar el muestreo te aparecera un porcentaje distinto, eso es lo que debemos observar, la variabilidad del porcentaje entre grupos. Ahora vamos a calcular mediante R 1000 grupos distintos de 30 personas y guardar el resultado de cada uno, para poder ver todos esos porcentajes juntos.

- Class: cmd_question
  Output: Arma 1000 grupos distintos con un total de 30 personas cada uno y guarda el porcentaje de Si de cada grupo. Guarda los valores en una variable llamada prop.
  CorrectAnswer: prop <- replicate(1000, mean(sample(poblacion, n, replace = FALSE) == "Si"))
  AnswerTests: omnitest(correctExpr='prop <- replicate(1000, mean(sample(poblacion, n, replace = FALSE) == "Si"))')
  Hint: Para este apartado debes usar la funcion replicate, para repetir la operacion las veces solicitadas (1000).

- Class: text
  Output: Genial! Ya tienes un total de 1000 grupos formados, vamos a resumirlos para poder interpretarlos.

- Class: cmd_question
  Output: Para ver el resultado de esos 1000 grupos, usa la funcion mean. Deberia acercarse bastante al 65% real.
  CorrectAnswer: mean(prop)
  AnswerTests: omnitest(correctExpr='mean(prop)')
  Hint: Es la misma funcion que ya usaste antes para sacar un porcentaje, pero ahora aplicada sobre el vector con los 1000 resultados.

- Class: mult_question
  Output: Si repitieras este experimento con muchas mas muestras (por ejemplo, 10000 grupos en vez de 1000), que esperarias que pase con el promedio de todas esas proporciones?
  AnswerChoices: Se acercaria aun mas a 0.65;Se alejaria de 0.65;Se acercaria a 0;No se puede saber
  CorrectAnswer: Se acercaria aun mas a 0.65
  AnswerTests: omnitest(correctVal='Se acercaria aun mas a 0.65')
  Hint: Piensa en la primera propiedad de P-gorro que vimos en la teoria, la media de P-gorro es identica a la proporcion poblacional p.

- Class: text
  Output: El promedio de esos 1000 porcentajes te dio muy cerca del 65% real de la poblacion? Eso confirma la primera propiedad que vimos en la teoria, el valor mas probable de P-gorro es justamente p, la proporcion poblacional. Aunque el resultado de cada muestra individual este disperso, al promediarlos debe dar un valor muy similar a p_real.

- Class: text
  Output: Vamos a observar la variabilidad de los datos mediante una funcion en R.

- Class: cmd_question
  Output: Observa dicha variabilidad mediante la funcion sd().
  CorrectAnswer: sd(prop)
  AnswerTests: omnitest(correctExpr='sd(prop)')
  Hint: Aplica la funcion al vector donde estan todos los datos agrupados.

- Class: text
  Output: Genial! Vamos a hacer una pequena comparacion de ese valor, con el valor que se obtiene de la formula que vimos al inicio.

- Class: cmd_question
  Output: Usa la formula, sqrt(p*(1-p)/n), recuerda que p = p_real
  CorrectAnswer: sqrt(p_real * (1 - p_real) / n)
  AnswerTests: test_formula_prop_hints()
  Hint: La formula es la raiz cuadrada de p_real por (1 - p_real), entre n. ||| Revisa si olvidaste aplicar la raiz cuadrada (sqrt) a todo el cociente. ||| Verifica que estes usando p_real (el de nuestra poblacion), no el 0.30 del ejemplo anterior.

- Class: mult_question
  Output: Comparando el valor que te dio sqrt(p_real*(1-p_real)/n) con el sd(prop) que calculaste antes, que puedes concluir?
  AnswerChoices: Son parecidos, la formula teorica predice bien la variabilidad observada;Son muy distintos, la formula no sirve;No se pueden comparar;El resultado deberia ser siempre 0
  CorrectAnswer: Son parecidos, la formula teorica predice bien la variabilidad observada
  AnswerTests: omnitest(correctVal='Son parecidos, la formula teorica predice bien la variabilidad observada')
  Hint: Si tus dos numeros (sd(prop) y la formula) estan cerca uno del otro, eso es justamente lo que la teoria predice.

- Class: text
  Output: Efectivamente, la formula sqrt(p*(1-p)/n) describe muy bien la variabilidad muestral que observaste, confirmando la segunda propiedad de P-gorro.

- Class: cmd_question
  Output: Por ultimo, crea una grafica donde puedas observar la dispersion de los valores. Usa la funcion hist().
  CorrectAnswer: hist(prop)
  AnswerTests: omnitest(correctExpr='hist(prop)')
  Hint: Recuerda el nombre del vector donde se encuentran todos los datos.

- Class: text
  Output: El grafico forma una especie de campana centrada cerca de 0.65, que es el mismo valor de nuestra p_real. La mayoria de los 1000 grupos dio un porcentaje cercano a ese numero, y muy pocos se alejaron mucho. Asi comprobamos, de forma visual, las tres propiedades que vimos al principio.

- Class: text
  Output: Con esto concluimos el tema de distribucion muestral de la proporcion. Conocimos las 3 propiedades de P-gorro y aprendimos a aplicarlas de forma manual, y despues, mediante funciones en RStudio, creamos una poblacion, obtuvimos muestras, y analizamos el comportamiento de un grupo de valores que seleccionamos de manera aleatoria.

- Class: text
  Output: Felicidades! Completaste la leccion de Distribuciones muestrales. Ya puedes construir la distribucion muestral de un estadistico, reconocer el Teorema del Limite Central en accion, y usar la formula del error estandar tanto para medias como para proporciones.
  
- Class: text
  Output: En la última lección aplicarás todo lo aprendido en una actividad integradora, Sigamos aprendiendo!
  
  
