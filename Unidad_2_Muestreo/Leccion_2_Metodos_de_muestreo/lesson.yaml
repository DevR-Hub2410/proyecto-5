- Class: text
  Output: Bienvenidos a esta lección, donde conocerás los diferentes tipos de muestreo y cómo aplicarlos. A lo largo de la lección hablaremos sobre el muestreo aleatorio simple, el muestreo sistemático, el muestreo estratificado, el muestreo por conglomerados y el muestreo por conveniencia. Al finalizar esta lección, serás capaz de identificar, diferenciar y aplicar los principales tipos de muestreo, seleccionando el más adecuado según las características de la población y los objetivos de la investigación. Comencemos...

#=================================================================================================================
#                                             MUESTREO ALEATORIO SIMPLE
#=================================================================================================================

- Class: text
  Output: Muestreo aleatorio simple...

- Class: text
  Output: Es solo uno de los varios tipos de muestreo que existen, trata de sacar individuos al azar de una lista, mejor conocido como el marco de la encuesta y todos los datos de la población tienen la misma probabilidad de ser seleccionados para ser parte de la muestra. #(Ana L, Carrilo, 2015, [16]) y (Casal & Mateu, 2003, p. 5).

- Class: text
  Output: Un ejemplo sencillo de este tipo de muestreo, sería en un salón de clases, donde ocupan a 3 personas que participen en un concurso de cuentos, entonces deciden hacer una ruleta que contenga los nombres de los 30 alumnos del salón, al girar la ruleta tres veces nombran a 3 personas, las cuales deberán participar en dicho concurso. Este es un ejemplo claro, ya que la población serían los 30 alumnos, todos tienen la misma probabilidad de ser seleccionados y fueron seleccionados de forma aleatoria.

- Class: mult_question
  Output: Del ejemplo anterior, ¿qué probabilidad había de que un alumno fuera seleccionado en el primer giro?
  AnswerChoices: 1/30; 30/1; 1/3; 0.5%
  CorrectAnswer: 1/30
  AnswerTests: omnitest(correctVal='1/30')
  Hint: Recuerda el total de alumnos que hay en el salón y cuántas veces aparece su nombre en la ruleta...

- Class: text
  Output: ¡Excelente! Tu respuesta es correcta y es más sencillo de lo que parece, es 1/30 ya que 30 es el total de alumnos y 1 es el número de veces que aparece el nombre de cada alumno en la ruleta.

- Class: text
  Output: En este ejemplo se seleccionó la muestra mediante una ruleta, pero aquí en Rstudio podemos seleccionarla más sencillo mediante la función sample(). Vamos a practicar un poco....

- Class: cmd_question
  Output: Ahora escribe sample(1:30, 3), este comando te mostrará 3 elementos de forma aleatoria del 1 al 30, Pruébalo...
  CorrectAnswer: sample(1:30, 3)
  AnswerTests: omnitest(correctExpr='sample(1:30, 3)')
  Hint: Escribe el comando señalado de forma idéntica.

- Class: text
  Output: Es importante mencionar que el ejemplo anterior aplica el muestreo sin reemplazo, el cual no permite repetir ningún elemento ya seleccionado. En cambio, el muestreo con reemplazo sí permite que un mismo elemento sea seleccionado más de una vez, y podemos aplicarlo agregando replace = TRUE a nuestra función. #(Ana L, Carrilo, 2015, [15])

- Class: cmd_question
  Output: Prueba con este rango de números 1:6, que representan la cantidad de caras que tiene un dado y haz que te muestre 10 datos, lo que representa los tiros. Guárdalo en una variable llamada dados.
  CorrectAnswer: dados <- sample(1:6, 10, replace = TRUE)
  AnswerTests: omnitest(correctExpr='dados <- sample(1:6, 10, replace = TRUE)')
  Hint: Recuerda agregar el replace = TRUE después del número de tiros.

- Class: text
  Output: ¡Excelente! Ahora ya sabes cómo aplicar el muestreo aleatorio simple, con y sin reemplazo mediante una función en RStudio.

- Class: text
  Output: |
      Para poder aplicar un muestreo aleatorio simple, se deben cumplir ciertas condiciones. Vamos a verlas paso a paso... #(Toledo Díaz de León, s.f , [30-33]).

      Paso 1. Definimos nuestra población (Población finita).

      Paso 2. Se elabora un marco muestral, lista de los datos.

      Paso 3. Se numeran todos los elementos de la lista.

      Paso 4. Por último, tomamos al azar una cantidad de datos, dándole a cada elemento la misma probabilidad de ser elegido y esta será nuestra muestra.

- Class: text
  Output: Ejemplo sencillo, una empresa quiere hacer una encuesta de satisfacción laboral, toma una población de 200 empleados (población finita), los enumera (marco muestral) y selecciona 20 empleados (muestra) de forma aleatoria mediante su número de seguro social, por último les aplica la encuesta a los seleccionados.

- Class: text
  Output: Este tipo de muestreo tiene como ventajas su facilidad de uso y su simplicidad al momento de interpretar los resultados, ya que cada elemento de la población tiene la misma probabilidad de ser seleccionado. Su principal limitación aparece cuando la población es demasiado grande y no se puede tener un listado completo de los datos, por lo que no se puede aplicar este tipo de muestreo. #(Canal Díaz, 2006, p. 123).

- Class: mult_question
  Output: El muestreo aleatorio simple se puede usar cuando la población es enorme y no hay un listado de los datos.
  AnswerChoices: Verdadero;Falso
  CorrectAnswer: Falso
  AnswerTests: omnitest(correctVal='Falso')
  Hint: Recuerda las limitaciones de dicho tipo de muestreo...

- Class: text
  Output: ¡Excelente! Reconociste y aprendiste las limitaciones de este tipo de muestreo. Ahora conociendo todo esto, vamos a resolver un pequeño ejercicio...

- Class: text
  Output: En el centro de la ciudad se abrió una pequeña librería, tan pequeña que solo tiene 94 libros, quieren tomar una muestra de 20 libros para saber el estado en el que se encuentran...

- Class: cmd_question
  Output: Primero crea un vector llamado libros, con el rango 1:94.
  CorrectAnswer: libros <- 1:94
  AnswerTests: omnitest(correctExpr='libros <- 1:94')
  Hint: Recuerda que para crear un vector se usa el símbolo <-

- Class: text
  Output: ¡Muy bien! Ahora todos los libros se encuentran en una lista, sencillo ¿no?...

- Class: cmd_question
  Output: Ahora, seleccionaremos los 20 libros que van a ser nuestra muestra, todo esto de manera aleatoria. Guarda los datos en un vector llamado muestra_libros. Usa el muestreo sin reemplazo.
  CorrectAnswer: muestra_libros <- sample(libros, 20)
  AnswerTests: omnitest(correctExpr='muestra_libros <- sample(libros, 20)')
  Hint: Recuerda que ahora en vez de usar el rango, debemos usar el nombre de nuestro vector "libros".

- Class: text
  Output: ¡Excelente! Sonaba muy complicado pero ya creaste tu marco muestral y seleccionaste tu muestra, es más sencillo de lo que parece...

- Class: cmd_question
  Output: Por último, solamente escribe el nombre del vector de la muestra para ver los elementos seleccionados.
  CorrectAnswer: muestra_libros
  AnswerTests: omnitest(correctExpr='muestra_libros')
  Hint: Escribe el nombre del vector sin errores.

- Class: text
  Output: Has llegado al final de la primera sección. Conocimos qué es el muestreo aleatorio simple, con y sin reemplazo, las condiciones para aplicarlo, sus ventajas y limitaciones, y aprendiste a seleccionar una muestra mediante sample(). Recuerda que este muestreo solo aplica para poblaciones finitas.

- Class: text
  Output: ¡Felicidades, completaste la sección 1 de 5! Ahora, ¿listo para conocer el siguiente tipo de muestreo?...

#=================================================================================================================
#                                             MUESTREO SISTEMÁTICO
#=================================================================================================================

- Class: text
  Output: Muestreo sistemático... En esta parte del curso haremos uso de operadores para la aplicación de fórmulas y de funciones de muestreo. Al final de esta sección comprenderás cuándo y cómo aplicar el muestreo sistemático.

- Class: text
  Output: El muestreo sistemático consiste en seleccionar cada k-ésimo elemento de una lista poblacional tras elegir aleatoriamente el primero. La letra k es la razón de muestreo, esto es, la razón del tamaño de la población correspondiente al tamaño de la muestra. #(Velázquez, 2017)

- Class: text
  Output: Los pasos para aplicarlo son; 1. Definir la población. 2. Determinar el tamaño de la muestra. 3. Calcular el intervalo de muestreo. Hacer uso de la fórmula, k = N/n.

- Class: mult_question
  Output: Antes de continuar con los pasos. En la fórmula para calcular el intervalo del muestreo k = N/n, ¿qué representan la N mayúscula y la n minúscula en la operación?
  AnswerChoices: Tamaño de la población (N), y tamaño de muestra (n);Tamaño de la población (n), y tamaño de muestra (N);Tamaño del intervalo (N), y tamaño de muestra (n)
  CorrectAnswer: Tamaño de la población (N), y tamaño de muestra (n)
  AnswerTests: omnitest(correctVal='Tamaño de la población (N), y tamaño de muestra (n)')
  Hint: Relaciona, ¿que es más grande, población o muestra?, ¿cómo lo representamos de forma visual?

- Class: text
  Output: Después de calcular el intervalo de muestreo (k), debemos; 4. Elegir un punto de partida, seleccionado aleatoriamente entre 1 y k. 5. Seleccionar elementos de muestra, tomando cada k-ésimo elemento de la lista de población a partir de ese punto de partida. #(Benítez, 1998)

- Class: text
  Output: Por ejemplo, un supermercado quiere evaluar la satisfacción de sus clientes y decide encuestar a 100 personas de las aproximadamente 2,000 que visitan la tienda en un día. Definimos N = 2000, n = 100, por lo que k = 2000/100 = 20. Escogemos un punto de inicio aleatorio entre el 1 y el 20; supongamos que sale el número 7.

- Class: text
  Output: Seleccionamos la muestra a partir de ahí, encuestando cada 20° cliente que entra a la tienda; Cliente 7, 27, 47, 67, 87, 107, 127... y así sucesivamente hasta completar 100 encuestas.

- Class: mult_question
  Output: ¿En cuál de los siguientes casos NO conviene usar muestreo sistemático?
  AnswerChoices: Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina;Una biblioteca selecciona cada 15º libro de un estante ordenado alfabéticamente por autor para revisar su estado de conservación;Una universidad selecciona a cada 8º estudiante de una lista ordenada aleatoriamente por número de identificación asignado al azar;Un ayuntamiento encuesta a cada 20ª vivienda de una calle, numeradas de forma consecutiva sin ningún patrón especial
  CorrectAnswer: Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina
  AnswerTests: omnitest(correctVal='Una fábrica revisa cada 10º producto en una línea de ensamblaje, y el proceso tiene un defecto que se repite exactamente cada 10 unidades por un ajuste periódico de la máquina')
  Hint: ¿El intervalo de muestreo (cada 10º, cada 15º, cada 20º, cada 8º) coincide con algún ciclo, patrón o repetición que ya exista de forma natural en esa población?

- Class: text
  Output: El muestreo sistemático falla cuando existe una periodicidad oculta en la población que coincide (o es múltiplo) del intervalo k. Por eso conviene revisar siempre si existe algún patrón cíclico antes de aplicar este método. #(Pereyra y Vaira, 2021)

- Class: text
  Output: Ahora utilizaremos funciones para obtener nuestro muestreo. Ya tienes disponible el vector 'alturas_arboles', con la altura (en metros) de los 200 árboles, medidos en orden consecutivo a lo largo del sendero. También tienes 'N' (tamaño de la población) y 'n' (tamaño de muestra deseado).

- Class: cmd_question
  Output: Primero, calcula el intervalo de muestreo k, dividiendo N entre n. Guarda el resultado en un objeto llamado 'k'.
  CorrectAnswer: k <- N / n
  AnswerTests: omnitest(correctExpr='k <- N / n')
  Hint: Recuerda que k = N / n.

- Class: cmd_question
  Output: Usa la función sample() para elegir un número aleatorio entre 1 y k. Guarda el resultado en un objeto llamado 'inicio'.
  CorrectAnswer: inicio <- sample(1:k, 1)
  AnswerTests: omnitest(correctExpr='inicio <- sample(1:k, 1)')
  Hint: Usa sample(1:k, 1) para elegir un solo número al azar entre 1 y k.

- Class: cmd_question
  Output: Con el punto de inicio definido, genera un vector con las posiciones seleccionadas usando seq(). Debe comenzar en 'inicio', avanzar de 'k' en 'k', y no pasarse de N. Guárdalo como 'posiciones'.
  CorrectAnswer: posiciones <- seq(inicio, N, by = k)
  AnswerTests: omnitest(correctExpr='posiciones <- seq(inicio, N, by = k)')
  Hint: seq(inicio, N, by = k) genera la secuencia completa de posiciones.

- Class: cmd_question
  Output: Ahora usa esas posiciones para extraer las alturas correspondientes del vector 'alturas_arboles', usando indexación con corchetes. Guarda el resultado como 'muestra'.
  CorrectAnswer: muestra <- alturas_arboles[posiciones]
  AnswerTests: omnitest(correctExpr='muestra <- alturas_arboles[posiciones]')
  Hint: Usa alturas_arboles[posiciones] para extraer los valores en esas posiciones.

- Class: cmd_question
  Output: Despliega la muestra obtenida.
  CorrectAnswer: muestra
  AnswerTests: omnitest(correctExpr='muestra')
  Hint: Escribe el nombre de la variable que acabas de generar en la consola.

- Class: cmd_question
  Output: Calcula el promedio de 'muestra' usando la función mean(), y guárdalo como 'promedio_muestral'.
  CorrectAnswer: promedio_muestral <- mean(muestra)
  AnswerTests: omnitest(correctExpr='promedio_muestral <- mean(muestra)')
  Hint: mean(muestra) calcula el promedio de tu muestra sistemática.

- Class: cmd_question
  Output: Escribe 'promedio_muestral' para desplegarlo en la consola.
  CorrectAnswer: promedio_muestral
  AnswerTests: omnitest(correctExpr='promedio_muestral')
  Hint: Solo escribe el nombre del objeto del promedio de la muestra.

- Class: text
  Output: Compara tu estimación muestral con el verdadero promedio poblacional, guardado en el objeto 'promedio_poblacional' (algo que en la vida real no conocerías, pero aquí sí porque simulamos toda la población).

- Class: cmd_question
  Output: Escribe 'promedio_poblacional' para ver el valor real, y compáralo con tu 'promedio_muestral'.
  CorrectAnswer: promedio_poblacional
  AnswerTests: omnitest(correctExpr='promedio_poblacional')
  Hint: Solo escribe el nombre del objeto del promedio de la población.

- Class: text
  Output: Notarás que ambos valores están muy cerca, porque al medir árboles en orden a lo largo de la transecta a intervalos regulares, el muestreo sistemático capturó bien la variación gradual del terreno, sin necesidad de medir los 200 árboles. Recuerda siempre revisar que no exista un patrón cíclico oculto que coincida con el intervalo k, ya que eso podría sesgar tus resultados.

- Class: text
  Output: ¡Felicidades! Completaste la sección 2 de 5, conozcamos el siguiente método de muestreo...

#=================================================================================================================
#                                             MUESTREO ESTRATIFICADO
#=================================================================================================================

- Class: text
  Output: Muestreo estratificado... Al terminar esta sección vas a poder identificar cuándo conviene usar muestreo estratificado, dividir una población en estratos, y seleccionar una muestra de cada uno usando R.

- Class: text
  Output: La estratificación permite tratar con subpoblaciones, aumenta la eficiencia de las estimaciones y contribuye a la administración eficiente de grandes encuestas. #(Gutiérrez, H. A. (2016)). Se divide la población en grupos en función de un carácter determinado y después se muestrea cada grupo aleatoriamente, para obtener la parte proporcional de la muestra. Este método se aplica para evitar que por azar algún grupo esté menos representado que los otros. #(Casal, J., y Mateu, E. (2003))

- Class: text
  Output: En nuestro caso vamos a usar el dispositivo que usa cada usuario como estrato, ya que cada usuario tiene un solo dispositivo principal, y eso si forma una partición real de la población.

- Class: cmd_question
  Output: Crea un vector llamado dispositivo con estos 10 valores, en este orden. Movil, Movil, Laptop, Tablet, Movil, Laptop, Movil, Tablet, Laptop, Movil.
  CorrectAnswer: dispositivo <- c("Movil", "Movil", "Laptop", "Tablet", "Movil", "Laptop", "Movil", "Tablet", "Laptop", "Movil")
  AnswerTests: omnitest(correctExpr='dispositivo <- c("Movil", "Movil", "Laptop", "Tablet", "Movil", "Laptop", "Movil", "Tablet", "Laptop", "Movil")')
  Hint: Usa <- y la funcion c(), con cada valor entre comillas.

- Class: mult_question
  Output: Cual es la principal razon para usar muestreo estratificado?
  AnswerChoices: Que todos los grupos de la población queden representados;Que sea mas rapido de calcular;Que no se necesite ningun calculo en R;Que la muestra sea siempre mas grande
  CorrectAnswer: Que todos los grupos de la población queden representados
  AnswerTests: omnitest(correctVal='Que todos los grupos de la población queden representados')
  Hint: Piensa en qué pasaría si todos los dispositivos de tu vector no quedaran representados en la muestra.

- Class: cmd_question
  Output: Mira cuantos usuarios hay en cada estrato de dispositivo. Escribe table(dispositivo).
  CorrectAnswer: table(dispositivo)
  AnswerTests: omnitest(correctExpr='table(dispositivo)')
  Hint: table() cuenta cuantas veces aparece cada valor dentro de un vector.

- Class: text
  Output: Cuando el tamaño de la muestra en cada estrato es proporcional al tamaño de ese estrato dentro de la población completa, se le llama afijación proporcional al tamaño. #(Puente, F., Hurtado, D., Morillo, J., Díaz, M., y Paz, G. (2017)). Por ejemplo, si de tus 10 usuarios, 5 usan Móvil, 3 usan Laptop y 2 usan Tablet, y quieres una muestra total de 4 usuarios con afijación proporcional, te tocaría tomar 2 de Móvil, 1 de Laptop y 1 de Tablet.

- Class: cmd_question
  Output: Calcula cuantos usuarios de cada dispositivo te tocarían en una muestra total de 4, usando afijación proporcional. Escribe round(table(dispositivo) / length(dispositivo) * 4).
  CorrectAnswer: round(table(dispositivo) / length(dispositivo) * 4)
  AnswerTests: omnitest(correctExpr='round(table(dispositivo) / length(dispositivo) * 4)')
  Hint: Divides cuantos hay en cada estrato entre el total de datos, y lo multiplicas por el tamaño de muestra que quieres, 4.

- Class: cmd_question
  Output: Ahora vamos a tomar la muestra real de cada estrato por separado, en vez de tomar una muestra de todo el vector junto. Usa split() para separar en estratos y sapply() para muestrear dentro de cada uno. Escribe sapply(split(1:10, dispositivo), sample, 2).
  CorrectAnswer: sapply(split(1:10, dispositivo), sample, 2)
  AnswerTests: omnitest(correctExpr='sapply(split(1:10, dispositivo), sample, 2)')
  Hint: split() separa las posiciones 1 al 10 en tres grupos, uno por cada dispositivo, y sapply() aplica sample() a cada grupo por separado.

- Class: mult_question
  Output: Cuál es la principal diferencia entre muestreo estratificado y muestreo por conglomerados?
  AnswerChoices: En estratificado seleccionas dentro de cada grupo, en conglomerados seleccionas grupos completos;En estratificado no se usan grupos, en conglomerados si;Son exactamente el mismo método con distinto nombre
  CorrectAnswer: En estratificado seleccionas dentro de cada grupo, en conglomerados seleccionas grupos completos
  AnswerTests: omnitest(correctVal='En estratificado seleccionas dentro de cada grupo, en conglomerados seleccionas grupos completos')
  Hint: En estratificado tomas una parte de cada estrato. En conglomerados, tomas grupos enteros y los incluyes completos, o los descartas completos.

- Class: text
  Output: Con esto concluyes la sección 3 de 5, Continuemos...

#=================================================================================================================
#                                             MUESTREO POR CONGLOMERADOS
#=================================================================================================================

- Class: text
  Output: Muestreo por conglomerados... Los conglomerados son poblaciones o grupos definidos de manera natural, cuyos elementos comparten características biológicas, económicas, sociales, entre otras. #(Ruiz Morales & Morillo Zárate, 2004, p. 135).

- Class: text
  Output: Un ejemplo sencillo de los conglomerados podría ser un panal de abejas, puesto que este grupo o población de dichos insectos que vive dentro de él, todo esto de forma natural e internamente heterogéneo.

- Class: mult_question
  Output: ¿Cuál de las siguientes opciones describe a un conglomerado?
  AnswerChoices: Un grupo definido por el investigador según un criterio de muestreo; Un grupo definido de forma natural; Un grupo seleccionado al azar dentro de la población; Un grupo con características internas homogéneas
  CorrectAnswer: Un grupo definido de forma natural
  AnswerTests: omnitest( correctVal ='Un grupo definido de forma natural')
  Hint: Recuerda el concepto de conglomerado y el ejemplo del panal de abejas.

- Class: text
  Output: |
      En este tipo de muestreo, la población total se divide en diferentes secciones o conglomerados, de las cuales se seleccionan aleatoriamente unas pocas, y se toman todos los elementos de las secciones seleccionadas. #(Ana L, Carrilo, 2015, [19-23]).

      Paso 1. Definir y delimitar los conglomerados.

      Paso 2. Elaborar un listado (marco muestral) de todos los conglomerados existentes.

      Paso 3. Seleccionar aleatoriamente algunos conglomerados.

      Paso 4. Estudiar todos los elementos de los conglomerados seleccionados (una etapa).

- Class: text
  Output: Un ejemplo sencillo podría ser si una universidad quiere conocer el nivel de satisfacción. En vez de encuestar a todos los alumnos que sería la población, los divide por campus (conglomerado), DMCU, ICB, ICSA, IADA y DMCG, de manera aleatoria toma 3 campus y les aplica la encuesta a todos los alumnos.

- Class: cmd_question
  Output: Crea un vector con los 5 campus (DMCU, ICB, ICSA, IADA, DMCG), guárdalo en una variable llamada campus.
  CorrectAnswer: campus <- c("DMCU", "ICB", "ICSA", "IADA", "DMCG")
  AnswerTests: omnitest(correctExpr='campus <- c("DMCU", "ICB", "ICSA", "IADA", "DMCG")')
  Hint: Recuerda que para crear un vector ocupas la función c() y asígnale nombre con <-

- Class: cmd_question
  Output: Ahora usemos la función sample(), para seleccionar 3 campus.
  CorrectAnswer: sample(campus, 3)
  AnswerTests: omnitest(correctExpr='sample(campus, 3)')
  Hint: Usa la función sample y el vector que creaste. sample(vector, n).

- Class: mult_question
  Output: Retomando el ejemplo anterior, si en vez de tomar solo 3 campus, tomamos los 5 y aplicamos la encuesta. ¿En este caso, seguiría siendo un muestreo conglomerado?
  AnswerChoices: Sí, porque el tipo de muestreo no depende de cuántos conglomerados se incluyan; No, porque al tomar todos los conglomerados ya no hay una selección aleatoria; No, porque el cambio en el número de campus altera la variable de estudio
  CorrectAnswer: No, porque al tomar todos los conglomerados ya no hay una selección aleatoria
  AnswerTests: omnitest( correctVal ='No, porque al tomar todos los conglomerados ya no hay una selección aleatoria')
  Hint: Recuerda muy bien los pasos de selección y en qué situaciones pueden aplicarse.

- Class: text
  Output: ¡Muy bien! También es importante saber que, si el conglomerado tiene una enorme cantidad de elementos, puedes tomar solo una pequeña muestra de él en lugar de estudiarlo por completo, y a esto se le denomina muestreo por conglomerados en dos etapas. #(Gallego, 2011, [7]).

- Class: mult_question
  Output: Si en un campus hay 4500 alumnos y se decide seleccionar a 200 alumnos para representar a la población de ese campus, ¿aún es un muestreo conglomerado de una etapa?
  AnswerChoices: No, ya que en una etapa se debe tomar en cuenta todos los elementos de los conglomerados; Sí, porque el campus sigue siendo uno de los conglomerados seleccionados al azar
  CorrectAnswer: No, ya que en una etapa se debe tomar en cuenta todos los elementos de los conglomerados
  AnswerTests: omnitest( correctVal ='No, ya que en una etapa se debe tomar en cuenta todos los elementos de los conglomerados')
  Hint: Ten en cuenta el paso 4 de la selección.

- Class: text
  Output: ¡Correcto! Justo ahí es cuando deja de ser una etapa y pasa a ser un muestreo por conglomerados de dos etapas, primero seleccionas los conglomerados al azar, y después tomas una muestra dentro de los seleccionados. Practiquemos esto con un ejercicio completo.

- Class: text
  Output: Una cadena de restaurantes quiere aplicar una encuesta de satisfacción a sus clientes. Ten en cuenta que dicha cadena tiene 8 sucursales.

- Class: cmd_question
  Output: El restaurante desea seleccionar aleatoriamente 2 de sus 8 sucursales. Usa la variable suc_sel para guardar los datos.
  CorrectAnswer: suc_sel <- sample(1:8, 2)
  AnswerTests: omnitest(correctExpr='suc_sel <- sample(1:8, 2)')
  Hint: Recuerda usar la función sample() correctamente.

- Class: text
  Output: Supongamos que al realizar este proceso, las sucursales seleccionadas fueron la 3 y 7, pero la sucursal 3 tiene 2000 clientes mensuales, lo cual es una cantidad significativa.

- Class: cmd_question
  Output: Extrae una muestra de 150 clientes de la sucursal número 3, y guárdala en una variable llamada mues_suc3. Usa el vector (sucursal_3)
  CorrectAnswer: mues_suc3 <- sample(sucursal_3, 150)
  AnswerTests: omnitest(correctExpr='mues_suc3 <- sample(sucursal_3, 150)')
  Hint: Recuerda usar el vector que se te solicita (sucursal_3).

