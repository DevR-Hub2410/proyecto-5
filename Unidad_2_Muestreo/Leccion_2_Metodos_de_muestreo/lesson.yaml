#=================================================================================================================
#                                             MUESTREO POR CONVENIENCIA
#=================================================================================================================

- Class: text
  Output: Muestreo por conveniencia... En esta fracción del curso conocerás las ventajas prácticas pertenecientes a este tipo de muestreo, así como sus limitaciones y sesgos generados.

- Class: text
  Output: El muestreo por conveniencia es un método que no utiliza selección aleatoria ni ningún criterio predefinido para elegir las unidades de muestra. En su lugar, el investigador selecciona las unidades en función de su conveniencia, como la proximidad, la disponibilidad o la voluntad de participar. Por ejemplo, clientes recurrentes de una tienda, o incluso amigos del investigador. #(Ardilla et al., 2004, p. 137)

- Class: mult_question
  Output: ¿Cuál de las siguientes situaciones describe mejor un muestreo de conveniencia?
  AnswerChoices: Dividir a la población en grupos y seleccionar aleatoriamente dentro de cada grupo; Seleccionar 100 estudiantes al azar de una lista completa de matrícula; Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado; Enumerar a todos los elementos de la población y usar un generador de números aleatorios
  CorrectAnswer: Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado
  AnswerTests: omnitest(correctVal='Encuestar a las personas que pasan frente a la entrada de un centro comercial en un momento dado')
  Hint: ¿Qué opción es más sencilla de realizar?

- Class: text
  Output: Este muestreo tiene ventajas como ser fácil y rápido de implementar, económico y eficiente, y útil cuando se tiene una población grande o difícil de alcanzar. No requiere diseñar un marco muestral ni usar técnicas de aleatorización, lo que ahorra tiempo y recursos. Por eso se usa mucho en pruebas piloto, para obtener datos básicos antes de un estudio más riguroso. #(Morales, s.f.)

- Class: text
  Output: Su principal crítica son los sesgos de selección, ya que no demuestra imparcialidad al escogerse y la muestra no es representativa de toda la población, pudiendo sobrerrepresentar o infrarrepresentar ciertos grupos. También es difícil estimar la variabilidad, los intervalos de confianza o los márgenes de error de este tipo de muestreo. #(Blanco y Castro, 2007)

- Class: mult_question
  Output: ¿Cuál es la principal desventaja del muestreo de conveniencia?
  AnswerChoices: Es muy costoso de implementar; Requiere demasiado tiempo de planeación; Puede producir una muestra sesgada que no representa a toda la población; No se puede aplicar a estudios cuantitativos
  CorrectAnswer: Puede producir una muestra sesgada que no representa a toda la población
  AnswerTests: omnitest(correctVal='Puede producir una muestra sesgada que no representa a toda la población')
  Hint: Aquí hay 3 mentiras y una verdad.

- Class: mult_question
  Output: Un profesor quiere conocer la opinión de 'los estudiantes de la universidad' sobre el comedor, pero solo encuesta a los alumnos de su propia clase de Estadística. ¿Qué problema tiene este enfoque?
  AnswerChoices: Es un muestreo estratificado por carrera; Es un censo, porque incluye a todos los estudiantes; Es un muestreo de conveniencia y puede no representar a toda la población estudiantil; Ninguno, es un muestreo aleatorio válido
  CorrectAnswer: Es un muestreo de conveniencia y puede no representar a toda la población estudiantil
  AnswerTests: omnitest(correctVal='Es un muestreo de conveniencia y puede no representar a toda la población estudiantil')
  Hint: El profesor usó un grupo accesible (su propia clase) en lugar de seleccionar aleatoriamente entre toda la población de estudiantes, ¿qué efecto puede producir en los resultados?

- Class: mult_question
  Output: ¿En qué escenario sería más razonable justificar el uso de un muestreo de conveniencia, a pesar de sus limitaciones?
  AnswerChoices: Un ensayo clínico para aprobar un nuevo medicamento; Un estudio nacional para determinar políticas públicas de salud; Un sondeo exploratorio rápido y de bajo presupuesto para probar una idea antes de un estudio más riguroso; Un censo poblacional oficial
  CorrectAnswer: Un sondeo exploratorio rápido y de bajo presupuesto para probar una idea antes de un estudio más riguroso
  AnswerTests: omnitest(correctVal='Un sondeo exploratorio rápido y de bajo presupuesto para probar una idea antes de un estudio más riguroso')
  Hint: ¿Qué diferencias existen en los niveles de presupuesto de cada opción mostrada?

- Class: text
  Output: ¡Felicidades! Completaste la sección 5 de 5, ya conociste los 5 tipos de muestreo y cómo aplicarlos, al igual que sus ventajas, limitaciones y diferencias. Ahora recapitulemos todo lo aprendido...

