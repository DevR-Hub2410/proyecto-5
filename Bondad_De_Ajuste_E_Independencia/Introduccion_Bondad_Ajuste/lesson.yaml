# Cierre
# ===============================================================

- Class: text
  Output: En esta lección aprendiste que una prueba de bondad de ajuste compara las frecuencias observadas con las frecuencias esperadas bajo un modelo teórico. También formulaste hipótesis, construiste los vectores en R, calculaste las frecuencias esperadas y ejecutaste chisq.test() para obtener el estadístico chi-cuadrada, los grados de libertad y el valor p.

- Class: text
  Output: Recuerda la secuencia de trabajo, identificar el modelo que se desea evaluar, formular H0 y H1, obtener las frecuencias observadas, calcular las frecuencias esperadas, verificar las condiciones de aplicación, ejecutar la prueba e interpretar el valor p en relación con el nivel de significancia.

- Class: text
  Output: En la siguiente lección aplicarás este procedimiento a tres distribuciones de probabilidad, normal, binomial y Poisson. Aprenderás cómo obtener las probabilidades teóricas y convertirlas en frecuencias esperadas para realizar las pruebas de bondad de ajuste.
    
