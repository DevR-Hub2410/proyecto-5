  Output: ¡Felicidades! Has concluido la lección sobre pruebas de independencia. A lo largo de esta unidad aprendiste a identificar situaciones en las que es necesario analizar la relación entre dos variables categóricas, organizar sus datos mediante tablas de contingencia y calcular las frecuencias esperadas bajo el supuesto de independencia.

- Class: text
  Output: También aplicaste la prueba chi-cuadrado de independencia mediante la función chisq.test() en R. A partir del valor p y del nivel de significancia, aprendiste a tomar decisiones sobre las hipótesis estadísticas e interpretar los resultados dentro del contexto de un problema.

- Class: text
