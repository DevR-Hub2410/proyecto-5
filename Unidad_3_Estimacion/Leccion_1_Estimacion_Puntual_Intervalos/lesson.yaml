  CorrectAnswer: Con 95% de confianza, la calificacion media de todos los usuarios está entre 4.03 y 4.36
  AnswerTests: omnitest(correctVal = 'Con 95% de confianza, la calificacion media de todos los usuarios está entre 4.03 y 4.36')
