  Output: La muestra sugiere que más de la mitad usa el modo oscuro. Veamos si el intervalo lo confirma. Usa prop.test() con sum(modo_oscuro == "Si") como número de éxitos y length(modo_oscuro) como total. Agrega conf.level = 0.95 y $conf.int, y guarda el intervalo en la variable intervalo_oscuro. 
  CorrectAnswer: intervalo_oscuro <- prop.test(sum(modo_oscuro == "Si"), length(modo_oscuro), conf.level = 0.95)$conf.int
