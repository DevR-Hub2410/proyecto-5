- Class: text
  Output: Antes de terminar, repasemos las ideas principales. La población es el conjunto total que queremos estudiar y la muestra es un subconjunto de ella. Un parámetro describe a la población, y un estadístico se calcula con una muestra. Un estimador es un estadístico que usamos para aproximar un parámetro desconocido. 
  
- Class: text
  Output: La estimación puntual usa un único valor para aproximar el parámetro, y un intervalo de confianza da un rango de valores con un nivel de confianza. Usamos R para calcular medias, proporciones e intervalos con t.test(), prop.test() y binom.test(), y practicamos cómo interpretarlos
  
- Class: text
  Output: Estos procedimientos sirven en situaciones reales de ingeniría de software, como analizar tiempos de respuesta, preferencias de usuarios o resultados de pruebas. En la siguiente lección veremos cómo se relacionan el nivel de confianza, la presición y el tamaño de la muestra. 
  
