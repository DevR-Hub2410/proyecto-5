  Output: En ocasiones, el tamaño de muestra calculado supera la cantidad de observaciones que se pueden obtener debido a limitaciones de tiempo o presupuesto. En ese caso, es importante analizar como cambia el margen de error con el tamaño de muestra disponible.

- Class: cmd_question
