#==============================
# Determinacion del tamaño de muestra
#==============================
- Class: text
  Output: En una investigacion es importante determinar el numero de participantes u observaciones que sera necesario incluir para alcanzar los objetivos del estudio. Este numero se conoce como tamaño de muestra y puede calcularse mediante formulas matematicas o herramientas estadisticas.

- Class: text
  Output: Para determinar el tamaño de muestra, primero debemos establecer el margen de error que estamos dispuestos a aceptar y el nivel de confianza deseado. Para estimar una media, podemos utilizar la formula n = (z * sd / E)^2, donde z es el valor critico, sd es la desviacion estandar y E es el margen de error permitido. Para estimar una proporcion, utilizamos n = (z^2 * p * (1 - p)) / E^2, donde p representa la proporcion esperada. Si no conocemos p, podemos utilizar 0.5 como estimacion inicial.

#==============================
# Actividad
#==============================
- Class: cmd_question
  Output: Una empresa desea estimar el tiempo medio de respuesta de sus servidores con un nivel de confianza del 95% y un margen de error de como maximo 10 milisegundos. Utiliza z_95 y sd_muestral para calcular el tamaño de muestra necesario. Redondea hacia arriba con ceiling() y guarda el resultado en n_requerido_media.
  CorrectAnswer: n_requerido_media <- ceiling((z_95 * sd_muestral / 10)^2)
  AnswerTests: test_n_media()
  Hint: Despeja n de la formula E = z * sd / sqrt(n). Utiliza n = (z * sd / E)^2 y redondea hacia arriba con ceiling().

- Class: cmd_question
  Output: Ejecuta la variable para verificar n_requerido_media.
  CorrectAnswer: n_requerido_media
  AnswerTests: omnitest(correctExpr = 'n_requerido_media')
  Hint: Escribe n_requerido_media para mostrar el resultado.

- Class: cmd_question
  Output: Ahora calcula el tamaño de muestra necesario para estimar una proporcion con un margen de error de 0.03 y un nivel de confianza del 95%. Como no conocemos la proporcion esperada, utiliza p = 0.5. Guarda el resultado en n_requerido_prop.
  CorrectAnswer: n_requerido_prop <- ceiling((z_95^2 * 0.5 * 0.5) / 0.03^2)
  AnswerTests: test_n_prop()
  Hint: Utiliza n = (z^2 * p * (1 - p)) / E^2, con z_95, p = 0.5 y E = 0.03.
  
- Class: cmd_question
  Output: Ejecuta la variable para verificar n_requerido_prop.
  CorrectAnswer: n_requerido_prop
  AnswerTests: omnitest(correctExpr = 'n_requerido_prop')
  Hint: Escribe n_requerido_prop para mostrar el resultado.

