  CorrectAnswer: margen_100 <- z_95 * sd_muestral / sqrt(100)
  AnswerTests: test_margen_100()
  Hint: Utiliza la formula E = z * sd / sqrt(n), sustituyendo n por 100.

- Class: cmd_question
  Output: Ejecuta margen_100 para observar el margen de error que se obtiene con las 100 observaciones disponibles.
  CorrectAnswer: margen_100
  AnswerTests: omnitest(correctExpr = 'margen_100')
  Hint: Escribe margen_100 para mostrar el resultado.
  
  
