#===============================================================
# Objetivo
#===============================================================

- Class: text
  Output: En esta lección aprenderás qué significa el nivel de confianza, el margen de error y la precisión de una estimación, y cómo se relacionan con el tamaño de la muestra. 
  
- Class: text
  Output: También usarás R para comparar los niveles de confianza de 90%, 95% y 99%, para ver cómo cambia el margen de error al aumentar el tamaño de la muestra y para calcular el tamaño de muestra que necesita un estudio. 
  
- Class: text
  Output: Para practicar, ya están cargados en R los tiempos de respuesta, en milisegundos, de una muestra de 40 mediciones de un servidor. Están en el vector tiempos_servidor. También tienes sus datos resumidos, media_muestral, sd_muestral y n_muestra, y los valores z que usaremos más adelante, z_90, z_95, z_99.
  
#===============================================================
# Nivel de confianza
#===============================================================

- Class: text
  Output: En la lección anterior vimos que todo intervalo de confianza tiene un nivel de confianza, casi siempre del 95%. Ahora veremos qué significa exactamente y por qué se usa tanto. 
  
- Class: text
  Output: El nivel de confianza indica qué proporción de los intervalos construidos con un mismo procedimiento contendría el parámetro poblacional si el muestreo se repitiera muchas veces. Con un nivel de 95%, aproximadamente 95 de cada 100 intervalos construidos así contendrían el parámetro (Lane et al., s. f.).
  
- Class: text
  Output: Un intervalo concreto, ya calculado, contiene el parámetro o no lo contiene. Por eso la confianza se refiere al procedimiento y no a un intervalo en particular. 
  
- Class: text
  Output: Por ejemplo, imagina una caja con muchos chocolates y quieres estimar qué proporción tiene caramelo. No puedes abrirlos todos, así que tomas 10 y 7 contienen caramelo. La estimación puntual es 70%, pero otra muestra de 10 daría otro valor. Con prop.test(7, 10) se obtiene un intervalo de confianza del 95%, aproximadamente de 35% a 92%. Es un rango de valores razonables para la proporción real, construido con un procedimiento que acierta el 95% de las veces. 
  
- Class: mult_question
  Output: ¿Cuál de las siguientes afirmaciones describe correctamente el nivel de confianza del 95%?
  AnswerChoices: Hay un 95% de probabilidad de que la media poblacional esté dentro de este intervalo específico;Si repitiéramos el muestreo muchas vecesm, aproximadamente el 95% de los intervalos construidos contendrían la media poblacional;El 95% de los datos de la muestra caen dentro del intervalo;La media muestral es igual a la media poblacional el 95% de las veces
  CorrectAnswer: Si repitiéramos el muestreo muchas veces, aproximadamente el 95% de los intervalos construidos contendrían la media poblacional
  AnswerTests: omnitest(correctVal = 'Si repitiéramos el muestreo muchas vecesm, aproximadamente el 95% de los intervalos construidos contendrían la media poblacional')
  Hint: Piensa a qué se refiere el 95%, si un intervalo que ya calculaste o a lo que pasaría al repetir el procedimiento muchas veces. 
  
- Class: text
  Output: El 95% es el nivel más usado, pero no el único. También se usan el 90% y el 99%. El 95% es una convención y no una regla, y la elección depende de qué tan costoso sea equivocarse y de qué tan precisa se necesite la estimación (Dunn, s. f.).
  
- Class: text
  Output: Al auementar el nivel de confianza, el procedimiento acierta más veces, pero el intervalo se hace más ancho y la estimación es menos precisa. Con 90% el intervalo es más estrecho, pero el procedimiento acierta menos veces. Con 99% acierta casi siempre, pero el intervalo es más ancho. El 95% suele considerarse un equilibrio entre ambas cosas. 
  
- Class: text
  Output: Para construir un intervalo se necesita un valor z, que depende del nivel de confianza. Con 95% de confianza queda 2.5% en cada cola de la distribución normal, así que buscamos el valor z que deja 0.975 de área acumulada. En R se obtiene con qnorm(0.975).
  
- Class: cmd_question
  Output: Calcula el valor z para 95% de confianza con qnorm() y guárdalo en la variable z_check.
  CorrectAnswer: z_check <- qnorm(0.975)
  AnswerTests: test_z_check()
  Hint: El 95% de confianza deja 0.025 en cada cola, así que el área acumulada que debes usar en qnorm() es 0.975. Guarda el resultado con <-.
  
- Class: text
  Output: Obtuviste aproximadamente 1.96, el mismo valor que usamos en la lección anterior. Los valores para 90% y 99% ya estan cargados, junto con el de 95%, z_90, z_95, z_99.
  
- Class: cmd_question
  Output: Escribe c(z_90, z_95, z_99) para ver los tres valores juntos. 
  CorrectAnswer: c(z_90, z_95, z_99)
  AnswerTests: omnitest(correctExpr = 'c(z_90, z_95, z_99)')
  Hint: Escribe c(z_90, z_95, z_99).
  
- Class: mult_question
  Output: Si aumentas el nivel de confianza de 95% a 99% sin cambiar nada más, ¿qué le pasa al intervalo de confianza?
  AnswerChoices: Se hace más angosto;Se hace más ancho;No cambia;Se convierte en un solo punto
  CorrectAnswer: Se hace más ancho 
  AnswerTests: omnitest(correctVal = 'Se hace más ancho')
  Hint: Compara los tres valores z que acabas de ver. Mientras mayor sea z, más lejos de la media llegan los límites del intervalo. 
  
#===============================================================
# Margen de error
#===============================================================

- Class: text
  Output: El margen de error describe qué tan lejos puede estar la estimación puntual del parámetro, dado un nivel de confianza y un tamaño de muestra. Para una media se calcula con E = z * sd / sqrt(n), y el intervalo de confianza es la media +- E (Lane et al., s. f.).
  
- Class: text
  Output: Por ejemplo, en una encuesta a 1000 estudiantes, el 60% dice que prefiere estudiar con música, con un margen de error de aproximadamente 3 puntos porcentuales. Entonces el intervalo va de 57% a 63%. Se estima que el 60% de los estudiantes prefiere estudiar con música, pero el valor real podría estar entre 57% y 63%.
  
- Class: exact_question
  Output: Una encuesta estima que el 60% de los estudiantes prefiere estudiar con música, con un margen de error de 3%. ¿Cuál es el límite inferior del intervalo? Escribe solo el número. 
  CorrectAnswer: 57
  AnswerTests: omnitest(correctVal = 57)
  Hint: El límite inferior es la estimación puntual menos el margen de error. 
  
- Class: text
  Output: Ahora calculemos un margen de error con los datos del servidor. Ya están cargados la desviación estándar, sd_muestral, el tamaño de la muestra, n_muestra, y el valor z, z_95.
  
- Class: cmd_question
  Output: Calcula el margen de error para 95% de confianza usando z_95, sd_muestral y n_muestra. Guárdalo en la variable margen_95.
  CorrectAnswer: margen_95 <- z_95 * sd_muestral / sqrt(n_muestra)
  AnswerTests: test_margen_95()
  Hint: La fórmula es E = z * sd / sqrt(n). Recuerda que n va dentro de una raíz cuadrada. 
  
- Class: cmd_question
  Output: Escribe margen_95 para ver el resultado. 
  CorrectAnswer: margen_95
  AnswerTests: omnitest(correctExpr = 'margen_95')
  Hint: Escribe margen_95.
  
- Class: text
  Output: El margen de error es de aproximadamente 11 ms. Como la media muestral es 251.8 ms, el intervalo de confianza del 95% va aproximadamente de 241 a 263 ms. Es decir, estimamos que el tiempo medio de respuesta del servidor está en ese rango. 
  
#===============================================================
# Precisión
#===============================================================

- Class: text
  Output: La precisión de una estimación está relacionada con el ancho del intervalo de confianza. Si el margen de error es pequeño, el intervalo es estrecho y la estimación es más precisa. Si el margen es grande, el intervalo es amplio y la estimación es menos precisa. 
  
- Class: text 
  Output: Por ejemplo, supón que el 60% de los estudiantes aprobó Cálculo II. Con un margen de error de 10%, el intervalo va de 50% a 70%, y tenemos poca precisión. Con un margen de 2%, el intervalo va de 58% a 62%, y la precisión es mucho mayor. 
  
- Class: mult_question
  Output: Un equipo obtiene dos estimaciones para la misma proporción. La primera tiene un margen de error de 8% y la segunda tiene un margen de error de 2%. ¿Cuál tiene mayor precisión?
  AnswerChoices: La estimación con margen de error de 8%;La estimación con margen de error de 2%;Ambas tienen la misma precisión;No es posible determinarlo
  CorrectAnswer: La estimación con margen de error de 2%
  AnswerTests: omnitest(correctVal = 'La estimación con margen de error de 2%')
  Hint: Piensa en el ancho del intervalo que produce cada margen de error. 
  
- Class: text
  Output: Veamos cómo cambia el margen de error con el nivel de confianza. Ya tienes cargados z_90, z_95, z_99. Como R trabaja con vectores, puedes calcular los tres márgenes de una sola vez. 
  
- Class: cmd_question
  Output: Calcula el margen de error para los tres niveles, 90%, 95% y 99%, usando el vector c(z_90, z_95, z_99). Guarda el resultado con margenes_comparados. 
  CorrectAnswer: margenes_comparados <- c(z_90, z_95, z_99) * sd_muestral / sqrt(n_muestra)
  AnswerTests: test_margenes_comparados()
  Hint: Multiplica c(z_90, z_95, z_99) por sd_muestral y divide entre sqrt(n_muestra). Guarda el resultado con <-. 
  
- Class: cmd_question 
  Output: Escribe margenes_comparados para ver los tres márgenes. 
  CorrectAnswer: margenes_comparados
  AnswerTests: omnitest(correctExpr = 'margenes_comparados')
  Hint: Escribe margenes_comparados.
  
- Class: text
  Output: Los márgenes son aproximadamente 9, 11 y 15 ms para 90%, 95% y 99%. A mayor nivel de confianza, mayor margen de error. 
  
- Class: exact_question
  Output: Sin usar la muestra, solo con los valores z, ¿aproximadamente cuántas veces más grande es el margen de error al 99% comparado con el margen al 90%? Redondea a 1 decimal y escribe solo el número. 
  CorrectAnswer: 1.6
  AnswerTests: test_num_aprox(1.6, 0.1)
  Hint: Divide z_99 entre z_90. El resultado no depende de la desviación estándar ni de n. 
  
- Class: mult_question
  Output: ¿Qué le pasa a la precisión de un intervalo cuando subes el nivel de confianza de 90% a 99%, manteniendo todo lo demás igual?
  AnswerChoices: Aumenta;Disminuye;No cambia;Depende solo del tamaño de la muestra 
  CorrectAnswer: Disminuye
  AnswerTests: omnitest(correctVal = 'Disminuye')
  Hint: Ganas confianza, pero el margen de error crece. Piensa qué pasa con la precisión cuando el intervalo se ensancha. 
  
#==============================
# Efecto del tamaño de muestra
#==============================
- Class: text
  Output: El tamaño de la muestra afecta directamente la precision y el margen de error de una estimacion. Cuando aumenta el tamaño de la muestra, se obtiene mas informacion y normalmente disminuye el margen de error, lo que permite obtener una estimacion mas precisa.

- Class: text
  Output: El tamaño de muestra aparece en el denominador de la formula del margen de error, dentro de una raiz cuadrada. Por esta razon, aumentar el numero de observaciones reduce el margen de error, pero no de manera proporcional. Por ejemplo, para reducir el margen de error a la mitad, se necesita cuadruplicar el tamaño de la muestra.

#==============================
# Actividad
#==============================
- Class: cmd_question
  Output: Calcula el margen de error con un nivel de confianza del 95% para tamaños de muestra de 20, 40 y 80. Utiliza el vector c(20, 40, 80) y guarda los resultados en la variable margenes_por_n.
  CorrectAnswer: margenes_por_n <- z_95 * sd_muestral / sqrt(c(20, 40, 80))
  AnswerTests: test_margenes_por_n()
  Hint: Utiliza z_95 * sd_muestral y divide entre sqrt(c(20, 40, 80)). Guarda el resultado con <-.

- Class: cmd_question
  Output: Ejecuta margenes_por_n para observar los margenes de error obtenidos.
  CorrectAnswer: margenes_por_n
  AnswerTests: omnitest(correctExpr = 'margenes_por_n')
  Hint: Escribe margenes_por_n para mostrar los resultados.

- Class: figure
  Output: Esta grafica muestra como disminuye el margen de error conforme aumenta el tamaño de la muestra. Observa que al principio disminuye mas rapidamente y despues la reduccion es menor.
