  Hint: El tamaño de muestra esta dentro de una raiz cuadrada, por lo que duplicarlo no divide el margen de error entre dos.

- Class: cmd_question
  Output: Calcula el margen de error con un nivel de confianza del 95% para un tamaño de muestra de 160 y guarda el resultado en la variable margen_n160. Este tamaño es cuatro veces una muestra de 40 observaciones.
  CorrectAnswer: margen_n160 <- z_95 * sd_muestral / sqrt(160)
  AnswerTests: test_margen_n160()
  Hint: Utiliza z_95 * sd_muestral / sqrt(160).

- Class: exact_question
  Output: Compara el margen de error original, margen_95, con margen_n160. ¿Por cuantas veces aproximadamente se redujo el margen de error al pasar de n = 40 a n = 160? Escribe solo el numero.
  CorrectAnswer: 2
  AnswerTests: test_num_aprox(2, 0.05)
