- Class: mult_question
  Output: Si duplicas el tamaño de muestra de 20 a 40, ¿el margen de error se reduce exactamente a la mitad?
  AnswerChoices: Si, se reduce exactamente a la mitad;No, se reduce menos de la mitad porque depende de la raiz cuadrada de n;No cambia en absoluto;Se duplica
  CorrectAnswer: No, se reduce menos de la mitad porque depende de la raiz cuadrada de n
