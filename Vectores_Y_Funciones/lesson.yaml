- Class: text
  Output: En esta lección aprenderemos a trabajar con vectores y funciones básicas de R. Los vectores permiten almacenar varios valores en un 
    mismo objeto, mientras que las funciones nos ayudan a realizar operaciones y analizar esos valores. Estos conocimientos serán fundamentales 
    para trabajar con datos estadísticos.

- Class: text
  Output: Un vector es una estructura que permite almacenar varios elementos del mismo tipo. Para crear uno utilizamos la función c(), que combina 
    los valores indicados dentro de sus paréntesis. Por ejemplo, c(5, 10, 15) crea un vector con tres números.

- Class: cmd_question
  Output: Crea un vector llamado numeros que contenga los valores 5, 10 y 15 utilizando c().
  CorrectAnswer: numeros <- c(5, 10, 15)
  AnswerTests: omnitest(correctExpr='numeros <- c(5, 10, 15)')
  Hint: Utiliza <- para asignar el vector y escribe los tres valores dentro de c(), separados por comas.

- Class: cmd_question
  Output: Escribe numeros en la consola para mostrar todos los elementos del vector.
  CorrectAnswer: numeros
  AnswerTests: omnitest(correctExpr='numeros')
  Hint: Escribe únicamente el nombre del vector.

- Class: text
  Output: Podemos acceder a un elemento específico de un vector utilizando corchetes []. En R, los índices comienzan en 1, por lo que el primer elemento 
    se encuentra en la posición 1, el segundo en la posición 2 y así sucesivamente.

- Class: cmd_question
  Output: Obtén el primer elemento del vector numeros.
  CorrectAnswer: numeros[1]
  AnswerTests: omnitest(correctExpr='numeros[1]')
  Hint: Escribe el nombre del vector seguido de [1].

- Class: cmd_question
  Output: Obtén el tercer elemento del vector numeros.
  CorrectAnswer: numeros[3]
  AnswerTests: omnitest(correctExpr='numeros[3]')
  Hint: Utiliza el índice 3 entre corchetes.

- Class: text
  Output: También podemos consultar cuántos elementos contiene un vector mediante la función length(). Esta función recibe el nombre del vector entre 
    paréntesis y devuelve la cantidad de elementos que contiene.

- Class: cmd_question
  Output: Utiliza length() para contar cuántos elementos contiene el vector numeros.
  CorrectAnswer: length(numeros)
  AnswerTests: omnitest(correctExpr='length(numeros)')
  Hint: Escribe length() y coloca numeros dentro de los paréntesis.

- Class: cmd_question
  Output: Crea un vector llamado edades que contenga los valores 18, 20, 22, 24 y 26.
  CorrectAnswer: edades <- c(18, 20, 22, 24, 26)
  AnswerTests: omnitest(correctExpr='edades <- c(18, 20, 22, 24, 26)')
  Hint: Utiliza c() para combinar los cinco números y <- para guardar el vector.

- Class: text
  Output: R permite realizar operaciones matemáticas directamente sobre los vectores. Por ejemplo, si sumamos 2 a un vector numérico, R suma 2 
    a cada uno de sus elementos. También podemos multiplicar, restar o dividir sus valores sin tener que operar elemento por elemento.

- Class: cmd_question
  Output: Suma 5 a cada elemento del vector numeros.
  CorrectAnswer: numeros + 5
  AnswerTests: omnitest(correctExpr='numeros + 5')
  Hint: Escribe numeros + 5 para sumar cinco a cada elemento.

- Class: cmd_question
  Output: Multiplica cada elemento del vector numeros por 2.
  CorrectAnswer: numeros * 2
  AnswerTests: omnitest(correctExpr='numeros * 2')
  Hint: Utiliza el operador * entre el nombre del vector y el número 2.

- Class: text
  Output: Ahora conoceremos algunas funciones básicas que permiten analizar los valores de un vector. La función sum() calcula la suma de sus elementos, 
    mientras que min() y max() permiten encontrar el valor mínimo y máximo, respectivamente.

- Class: cmd_question
  Output: Calcula la suma de todos los elementos del vector numeros utilizando sum().
  CorrectAnswer: sum(numeros)
  AnswerTests: omnitest(correctExpr='sum(numeros)')
  Hint: Escribe sum() y coloca numeros dentro de los paréntesis.

- Class: cmd_question
  Output: Encuentra el valor más pequeño del vector numeros utilizando min().
  CorrectAnswer: min(numeros)
  AnswerTests: omnitest(correctExpr='min(numeros)')
  Hint: La función min() devuelve el menor valor del vector.

- Class: cmd_question
  Output: Encuentra el valor más grande del vector numeros utilizando max().
  CorrectAnswer: max(numeros)
  AnswerTests: omnitest(correctExpr='max(numeros)')
  Hint: Utiliza max() con el nombre del vector.

- Class: text
  Output: Una de las funciones más importantes en estadística es mean(), que calcula la media aritmética de un conjunto de valores. Para obtenerla, 
    sumamos todos los elementos y dividimos el resultado entre la cantidad de elementos. En R podemos realizar este cálculo directamente con mean().

- Class: cmd_question
  Output: Calcula la media aritmética de los elementos del vector numeros utilizando mean().
  CorrectAnswer: mean(numeros)
  AnswerTests: omnitest(correctExpr='mean(numeros)')
  Hint: Escribe mean() y coloca numeros dentro de los paréntesis.

- Class: cmd_question
  Output: Crea un vector llamado calificaciones que contenga los valores 8, 9, 7 y 10.
  CorrectAnswer: calificaciones <- c(8, 9, 7, 10)
  AnswerTests: omnitest(correctExpr='calificaciones <- c(8, 9, 7, 10)')
  Hint: Utiliza c() para agrupar las cuatro calificaciones.

- Class: cmd_question
  Output: Calcula la media de las calificaciones utilizando mean().
  CorrectAnswer: mean(calificaciones)
  AnswerTests: omnitest(correctExpr='mean(calificaciones)')
  Hint: Utiliza mean() con el nombre calificaciones.

- Class: text
  Output: También podemos utilizar summary() para obtener un resumen de los valores de un vector numérico. Este resumen incluye el mínimo, el primer 
    cuartil, la mediana, la media, el tercer cuartil y el máximo. Es una herramienta útil para comenzar a explorar un conjunto de datos.

- Class: cmd_question
  Output: Utiliza summary() para obtener un resumen estadístico del vector calificaciones.
  CorrectAnswer: summary(calificaciones)
  AnswerTests: omnitest(correctExpr='summary(calificaciones)')
  Hint: Escribe summary() y coloca calificaciones dentro de los paréntesis.

- Class: text
  Output: ¡Excelente! Has aprendido a crear vectores con c(), consultar elementos mediante índices y contar sus valores con length(). También utilizaste 
    funciones como sum(), min(), max(), mean() y summary() para analizar datos. Estos conocimientos te ayudarán a construir tablas de frecuencia y calcular 
    medidas estadísticas en las siguientes lecciones.
  