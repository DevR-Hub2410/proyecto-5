- Class: text
  Output: Comenzaremos a programar en R con instrucciones sencillas. Primero aprenderemos a mostrar mensajes y resultados utilizando 
    print(). También conoceremos cómo ejecutar operaciones directamente en la consola.
  
- Class: cmd_question
  Output: Escribe el mensaje "Hola Mundo desde R" utilizando la funcion print().
  CorrectAnswer: print("Hola Mundo desde R")
  AnswerTests: omnitest(correctExpr = 'print("Hola Mundo desde R")')
  Hint: Recuerda que para imprimir un mensaje debes usar comillas doble en el print().
  
- Class: cmd_question
  Output: No solo se usa para imprimir mensajes, tambien puedes imprimir operaciones, imprime la suma 5 + 6 usando print.
  CorrectAnswer: print(5 + 6)
  AnswerTests: omnitest(correctExpr = 'print(5 + 6)')
  Hint: Debes de poner adentro del print() la suma.
  
- Class: cmd_question
  Output: No requieres usar el print para imprimir operaciones,, escribe en la terminal 5 + 6 - 7.
  CorrectAnswer: 5 + 6 - 7
  AnswerTests: omnitest(correctExpr = '5 + 6 - 7')
  Hint: No requieres de print() para que R te imprima el resultado.
  
- Class: cmd_question
  Output: Calcula el resultado de multiplicar 4 por 3 directamente en la consola.
  CorrectAnswer: 4 * 3
  AnswerTests: omnitest(correctExpr='4 * 3')
  Hint: En R, el operador de multiplicación es el asterisco (*).

- Class: cmd_question
  Output: Calcula el resultado de dividir 20 entre 4.
  CorrectAnswer: 20 / 4
  AnswerTests: omnitest(correctExpr='20 / 4')
  Hint: Utiliza la barra inclinada (/) para dividir dos números.
  
- Class: cmd_question
  Output: Tambien puedes compara dos valores, verifica si 10 es menor que 5.
  CorrectAnswer: 10 < 5
  AnswerTests: omnitest(correctExpr='10 < 5')
  Hint: Utiliza el simbolo de menor (<) para comparar los dos valores.
  
- Class: cmd_question
  Output: ¿10 es mayor o igual que 1?.
  CorrectAnswer: 10 >= 1
  AnswerTests: omnitest(correctExpr='10 >= 1')
  Hint: Utiliza el simbolo de mayor o igual (>=) para comparar los dos valores.
  
- Class: text
  Output: En R podemos almacenar valores en variables. Para crear uno, escribimos su nombre, el operador de asignación <- y el 
    valor que deseamos guardar. Por ejemplo, x <- 25 almacena el valor 25 en la variable x. Las variables pueden guardar números enteros, 
    números decimales, valores lógicos y texto.
    
- Class: cmd_question
  Output: Crea una variable llamada x que sea igual a 67.
  CorrectAnswer: x <- 67
  AnswerTests: omnitest(correctExpr = 'x <- 67')
  Hint: Recuerda que para asignar un valor a una variable debes de usar estos simbolos <-.
  
- Class: cmd_question
  Output: Escribe la variable x para ver que valor tiene.
  CorrectAnswer: x
  AnswerTests: omnitest(correctExpr = 'x')
  Hint: Debes de ingresar x en la terminal.
  
- Class: text
  Output: Las variables también pueden utilizarse en operaciones matemáticas. En lugar de escribir los números directamente, podemos 
    utilizar los nombres de los objetos que los contienen. De esta manera, podemos reutilizar los valores almacenados en diferentes cálculos.
  
- Class: cmd_question
  Output: Crea una variable y que sea igual a 33.
  CorrectAnswer: y <- 33
  AnswerTests: omnitest(correctExpr = 'y <- 33')
  Hint: Debes de ingresar x en la terminal.
  
- Class: cmd_question
  Output: Escribe la suma de x e y .
  CorrectAnswer: x + y
  AnswerTests: omnitest(correctExpr = 'x + y')
  Hint: Tienes que sumar x + y.
  
- Class: cmd_question
  Output: Calcula la diferencia entre x e y utilizando el operador de resta.
  CorrectAnswer: x - y
  AnswerTests: omnitest(correctExpr='x - y')
  Hint: Utiliza x como primer valor e y como segundo valor, separados por -.
  
- Class: text
  Output: R permite generar secuencias numéricas de forma sencilla mediante el operador de dos puntos (:). Al escribir un número inicial 
    y uno final separados por dos puntos, R genera una secuencia de números enteros consecutivos, incluyendo ambos extremos. Por ejemplo, 1:5 
    produce los valores del 1 al 5.
    
- Class: cmd_question
  Output: Prueba imprimiendo los numeros del 1 al 10.
  CorrectAnswer: 1:10
  AnswerTests: omnitest(correctExpr = '1:10')
  Hint: Recuerda poner primero 1, dos puntos, y al final 10.
  
- Class: cmd_question
  Output: Genera una secuencia descendente desde el 5 hasta el 1.
  CorrectAnswer: 5:1
  AnswerTests: omnitest(correctExpr='5:1')
  Hint: Para generar una secuencia descendente, escribe primero el número mayor y después el menor.
  
- Class: text
  Output: ¡Excelente! Has aprendido a mostrar mensajes, realizar operaciones matemáticas, crear objetos y consultar sus valores. También conoces 
    algunos tipos de datos y sabes generar secuencias numéricas. Estos conocimientos serán la base para trabajar con vectores y realizar cálculos estadísticos en R.