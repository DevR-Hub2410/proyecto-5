  Output: ¡Felicidades! Has concluido la lección sobre pruebas de bondad de ajuste para distribuciones de probabilidad. Ahora conoces cómo utilizar los modelos normal, binomial y Poisson para calcular probabilidades teóricas, obtener frecuencias esperadas y evaluar si los datos observados son compatibles con una distribución propuesta.


