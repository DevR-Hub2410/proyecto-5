- Class: text
  Output: A lo largo de esta lección trabajamos con tres distribuciones de probabilidad. Aunque todas permiten modelar fenómenos aleatorios, cada una se utiliza en situaciones diferentes. La distribución normal modela variables continuas, la binomial cuenta éxitos en un número fijo de ensayos y la distribución de Poisson cuenta eventos dentro de un intervalo determinado.

- Class: text
  Output: En R también utilizamos funciones diferentes para calcular sus probabilidades. Para la distribución normal empleamos pnorm(), para la binomial utilizamos dbinom() y para Poisson utilizamos dpois(). Cuando necesitamos probabilidades acumuladas o de cola, podemos recurrir a funciones como pnorm() y ppois(), según el modelo que estemos trabajando.

- Class: mult_question
