  AnswerChoices: Para obtener las frecuencias observadas; Para convertir las probabilidades en frecuencias esperadas; Para calcular directamente el valor p; Para modificar los grados de libertad
  CorrectAnswer: Para convertir las probabilidades en frecuencias esperadas
  AnswerTests: omnitest(correctVal='Para convertir las probabilidades en frecuencias esperadas')
