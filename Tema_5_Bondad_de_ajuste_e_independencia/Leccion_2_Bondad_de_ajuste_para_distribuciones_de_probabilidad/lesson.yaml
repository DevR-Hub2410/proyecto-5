- Class: text
  Output: Recuerda que, independientemente de la distribución utilizada, el procedimiento de bondad de ajuste sigue una misma idea. Primero identificamos el modelo teórico, después calculamos sus probabilidades, las convertimos en frecuencias esperadas y las comparamos con las frecuencias observadas mediante la prueba chi-cuadrado.

- Class: text
  Output: Finalmente, interpretamos el valor p utilizando un nivel de significancia. Si el valor p es menor o igual que alfa, rechazamos la hipótesis nula. Si es mayor, no encontramos evidencia estadística suficiente para rechazarla. Esta decisión debe interpretarse dentro del contexto del problema y no como una demostración de que el modelo es verdadero.

