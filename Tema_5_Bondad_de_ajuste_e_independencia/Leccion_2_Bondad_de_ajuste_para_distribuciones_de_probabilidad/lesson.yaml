  AnswerChoices: Distribución normal; Distribución binomial; Distribución de Poisson; Distribución uniforme
  CorrectAnswer: Distribución binomial
  AnswerTests: omnitest(correctVal='Distribución binomial')
  Hint: Tenemos un número fijo de ensayos y cada uno tiene dos resultados posibles, éxito o fracaso.

- Class: mult_question
  Output: Una tienda registra cuántos clientes llegan durante cada hora. Se conoce que llegan en promedio ocho clientes por hora y se cumplen las condiciones del modelo. ¿Qué distribución sería adecuada para estudiar esta cantidad?
  AnswerChoices: Distribución normal; Distribución binomial; Distribución de Poisson; Distribución uniforme
  CorrectAnswer: Distribución de Poisson
  AnswerTests: omnitest(correctVal='Distribución de Poisson')
