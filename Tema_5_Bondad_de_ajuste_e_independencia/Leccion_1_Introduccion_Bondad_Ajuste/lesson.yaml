#===============================================================
# Introduccion
#===============================================================
- Class: text
  Output: En estadística, frecuentemente trabajamos con situaciones en las que tenemos una idea previa de cómo deberían comportarse ciertos datos. Por ejemplo, un dado justo debería presentar la misma probabilidad de obtener cualquiera de sus seir caras, una moneda equilibrada debería presentar la misma probabilidad de obtener cara o cruz, y la cantidad de llamadas recibidas por una central telefónica durante un intervalo podría seguir una distribución de Poisson. 
  
- Class: text
  Output: Sin embargo, que existe un comportamiento esperado no significa que los resultados observados coincidan exactamente con él. Esto suecede porque los resultados de una muestra pueden presentar variaciones aleatorias. 
  
- Class: text
  Output: Una prueba de bondad de ajuste permite evaluar si las diferencias entre los resultados observados y los que esperaríamos bajo una distribución teórica son suficientemente grandes como para cuestionar dicho modelo. 
  
